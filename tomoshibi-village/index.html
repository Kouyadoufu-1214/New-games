<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ともしびの村</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="昼は村を育て、夜は影から灯を守る。街づくりとサバイバルのスマホゲーム">
<meta name="theme-color" content="#0f1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ともしび">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: a one-screen night village. Resource strip on top, the lantern-lit map fills the middle,
     a build tray (day) or skill tray (night) docks at the bottom. One dark world by design. */
  color-scheme:dark;
  --night:#0f1326; --night-2:#141933; --panel:#1b2140; --panel-2:#252c50; --line:#343c68;
  --ink:#f3ead8; --ink-soft:#a9a6c4; --amber:#ffb547; --amber-deep:#c97a14; --amber-ink:#2a1700;
  --ember:#ff6b3d; --moss:#7fd08a; --danger:#ff6b6b; --violet:#c9a6ff; --violet-deep:#3a2d6e;
  --font-display:"Zen Antique Soft","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--night);overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,p{margin:0}
.screen{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen>*{width:100%;max-width:560px;margin-inline:auto}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;cursor:pointer;touch-action:manipulation;font-weight:900;font-size:15px;line-height:1.3;
  background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 #0a0d1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .08s ease,box-shadow .08s ease;text-align:center}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 #0a0d1c}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{font-size:11.5px;font-weight:700;opacity:.85}
.btn:focus-visible,.card:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn-amber{background:var(--amber);color:var(--amber-ink);box-shadow:0 4px 0 var(--amber-deep)}
.btn-amber:active:not([disabled]){box-shadow:0 1px 0 var(--amber-deep)}
.btn-night{background:linear-gradient(180deg,#4a3a88,#30265e);color:#efe6ff;box-shadow:0 4px 0 #17122e}
.btn-night:active:not([disabled]){box-shadow:0 1px 0 #17122e}
.btn-danger{color:var(--danger)}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}

/* title */
#title{justify-content:center;align-items:center;text-align:center;gap:20px;padding-block:24px;
  background:radial-gradient(circle at 50% 34%,rgba(255,181,71,.26),rgba(255,181,71,0) 42%),var(--night)}
.title-lantern{font-size:68px;line-height:1;filter:drop-shadow(0 0 22px rgba(255,170,60,.85));animation:flicker 3.2s ease-in-out infinite}
.title-name{font-family:var(--font-display);font-weight:400;font-size:46px;letter-spacing:.14em;line-height:1.2;text-shadow:0 0 30px rgba(255,181,71,.35)}
.title-story{color:var(--ink-soft);font-size:14px;line-height:1.95}
.title-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.title-actions .btn{padding:15px 16px;font-size:17px}
.title-best{font-size:12.5px;color:var(--ink-soft)}

/* hud */
.hud{display:flex;flex-direction:column;gap:6px;padding-block:8px 0}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day{display:flex;align-items:center;gap:8px}
.day b{font-family:var(--font-display);font-weight:400;font-size:23px;line-height:1}
.phase{font-size:12px;font-weight:900;padding:3px 10px;border-radius:99px;background:rgba(255,181,71,.16);color:var(--amber)}
.phase.night{background:rgba(201,166,255,.16);color:var(--violet)}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:0}
.chip .v{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .v i{font-style:normal;margin-right:2px}
.chip .v i.sh{color:var(--amber)}
.chip .d{font-size:10.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .d.up{color:var(--moss)}
.chip .d.down{color:var(--danger)}
.chip.flash{animation:chipflash .6s ease}
.quest{display:flex;align-items:center;gap:10px;min-height:44px;background:linear-gradient(90deg,rgba(255,181,71,.15),rgba(255,181,71,.03));
  border:1px solid rgba(255,181,71,.32);border-radius:14px;padding:5px 6px 5px 12px;margin-top:6px}
.quest.nightq{background:linear-gradient(90deg,rgba(201,166,255,.14),rgba(201,166,255,.03));border-color:rgba(201,166,255,.3)}
.q-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.q-label{font-size:10.5px;font-weight:900;color:var(--amber);letter-spacing:.12em}
.nightq .q-label{color:var(--violet)}
.q-text{font-size:13px;font-weight:700}
.q-reward{font-size:11px;color:var(--ink-soft);font-weight:700}
.q-claim{padding:8px 12px;font-size:13px;flex:none}

/* stage */
.stage{flex:1;min-height:0;position:relative;margin-block:6px;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.place-hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;z-index:2;
  background:rgba(15,19,38,.92);border:1px solid var(--amber);border-radius:99px;padding:4px 4px 4px 14px;font-size:12.5px;font-weight:700}
.place-hint button{border:0;border-radius:99px;background:var(--panel-2);padding:6px 12px;font-weight:900;font-size:12px;cursor:pointer}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;z-index:2}
.banner.show{opacity:1;transform:none}
.banner b{display:block;font-family:var(--font-display);font-weight:400;font-size:30px;text-shadow:0 2px 16px #000,0 0 30px rgba(0,0,0,.8)}
.banner span{display:block;font-size:14px;font-weight:700;color:var(--ink);text-shadow:0 1px 8px #000}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:9px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.cards{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.cards::-webkit-scrollbar{display:none}
.card{flex:none;width:78px;border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;touch-action:manipulation}
.card .ic{font-size:24px;line-height:1.25;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .nm{font-size:11.5px;font-weight:900;white-space:nowrap}
.card .cs{font-size:10px;font-weight:700;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.card.poor .cs{color:var(--danger)}
.card.locked{opacity:.42}
.card.active{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.card.lamp{background:linear-gradient(180deg,#3a2a12,#2a2140);border-color:#6a4e22}
.panel-row{display:flex;align-items:center;gap:10px}
.hint{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);line-height:1.45}
.hint b{color:var(--ink)}
.hint .warn{color:var(--danger);font-weight:700}
#nightBtn{flex:none;min-width:128px;padding:10px 14px}
.lamp-hp{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}
.lamp-hp .bar{flex:1;height:12px;border-radius:99px;background:#2b1b22;overflow:hidden;border:1px solid var(--line)}
.lamp-hp .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ember),var(--amber));transition:width .15s linear}
.lamp-hp b{font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.skills{display:grid;grid-template-columns:1fr 1fr 58px;gap:8px}
.skill{position:relative;overflow:hidden;padding:10px 8px}
.skill .cd{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(5,6,14,.62);transform-origin:bottom;transform:scaleY(var(--cd,0));pointer-events:none}
.skill .sk-t{position:absolute;right:8px;top:6px;font-size:11px;font-weight:900;color:var(--ink)}
.wave-text{font-size:12px;color:var(--ink-soft);font-weight:700;text-align:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,4,12,.62);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:rise .32s cubic-bezier(.2,1.25,.4,1) both}
.sheet-kicker{font-size:12px;font-weight:900;color:var(--amber);letter-spacing:.1em}
.sheet-title{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;display:flex;align-items:center;gap:10px}
.sheet-title .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:30px}
.sheet-body{display:flex;flex-direction:column;gap:10px;font-size:14px}
.sheet-body p{line-height:1.7}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--moss)}
.status.bad{color:var(--danger)}
.rows{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border-radius:14px;padding:10px 12px}
.rows>div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.rows span{color:var(--ink-soft);font-weight:700}
.rows b{font-variant-numeric:tabular-nums;text-align:right}
.rows .total{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px}
.steps .n{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--panel-2);color:var(--amber);font-weight:900}
.steps b{display:block}
.steps p{font-size:13px;color:var(--ink-soft);line-height:1.6}
.note{font-size:12.5px;color:var(--ink-soft);background:var(--panel-2);border-radius:12px;padding:9px 12px;line-height:1.6}
.sheet-actions{display:flex;flex-direction:column;gap:8px}
.sheet-actions.two{display:grid;grid-template-columns:1fr 1fr}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-170%);z-index:40;width:max-content;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--night);font-weight:900;font-size:13px;padding:9px 16px;border-radius:99px;text-align:center;transition:transform .35s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
.toast.show{transform:translate(-50%,0)}

@keyframes flicker{0%,100%{filter:drop-shadow(0 0 22px rgba(255,170,60,.85))}45%{filter:drop-shadow(0 0 30px rgba(255,170,60,1))}55%{filter:drop-shadow(0 0 16px rgba(255,170,60,.7))}}
@keyframes rise{0%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes chipflash{0%{box-shadow:0 0 0 0 rgba(255,181,71,.0)}30%{box-shadow:0 0 0 3px rgba(255,181,71,.7)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section id="title" class="screen" aria-label="タイトル">
  <div class="title-lantern" aria-hidden="true">🏮</div>
  <h1 class="title-name">ともしびの村</h1>
  <p class="title-story">闇におおわれた土地に、最後のともしびが灯った。<br>昼は村を育て、夜は影から灯を守れ。</p>
  <div class="title-actions">
    <button class="btn btn-amber" id="continueBtn" type="button" hidden></button>
    <button class="btn" id="newBtn" type="button">新しい村をはじめる</button>
  </div>
  <p class="title-best" id="titleBest"></p>
</section>

<section id="game" class="screen" aria-label="村" hidden>
  <header class="hud">
    <div class="hud-top">
      <div class="day"><b id="dayNum">1日目</b><span class="phase" id="phase">昼</span></div>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="メニュー"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
    <div class="res">
      <div class="chip" id="c-wood"><span class="v"><i>🪵</i><b id="v-wood">0</b></span><span class="d" id="d-wood"></span></div>
      <div class="chip" id="c-stone"><span class="v"><i>🪨</i><b id="v-stone">0</b></span><span class="d" id="d-stone"></span></div>
      <div class="chip" id="c-food"><span class="v"><i>🍞</i><b id="v-food">0</b></span><span class="d" id="d-food"></span></div>
      <div class="chip" id="c-pop"><span class="v"><i>👤</i><b id="v-pop">0</b></span><span class="d" id="d-pop"></span></div>
      <div class="chip" id="c-shards"><span class="v"><i class="sh">✦</i><b id="v-shards">0</b></span><span class="d" id="d-shards">かけら</span></div>
    </div>
  </header>
  <div class="quest" id="quest">
    <div class="q-main"><span class="q-label" id="qLabel">目標</span><span class="q-text" id="qText"></span><span class="q-reward" id="qReward"></span></div>
    <button class="btn btn-amber q-claim" id="qClaim" type="button" hidden>受け取る</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="村の地図"></canvas>
    <div class="place-hint" id="placeHint" hidden><span id="placeText"></span><button id="placeCancel" type="button">やめる</button></div>
    <div class="banner" id="banner"></div>
  </div>
  <div class="panel" id="dayPanel">
    <div class="cards" id="cards"></div>
    <div class="panel-row">
      <p class="hint" id="hint"></p>
      <button class="btn btn-night" id="nightBtn" type="button"><span>夜を迎える</span><small id="nightSub"></small></button>
    </div>
  </div>
  <div class="panel" id="nightPanel" hidden>
    <div class="lamp-hp"><span>灯</span><div class="bar"><i id="lampBar"></i></div><b id="lampText"></b></div>
    <div class="skills">
      <button class="btn skill" id="skill0" type="button"><span>ひかりの波</span><small>光の中の影に大ダメージ</small><i class="cd"></i><span class="sk-t" id="sk0t"></span></button>
      <button class="btn skill" id="skill1" type="button"><span>応急修理</span><small>建物と灯を少し回復</small><i class="cd"></i><span class="sk-t" id="sk1t"></span></button>
      <button class="btn" id="speedBtn" type="button" aria-label="夜の速さ">×1</button>
    </div>
    <p class="wave-text" id="waveText"></p>
  </div>
</section>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-kicker" id="sheetKicker"></div>
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
document.documentElement.lang = 'ja';
const $ = (id) => document.getElementById(id);
const COLS = 9, ROWS = 11, CX = 4, CY = 5, LI = CY * COLS + CX;
const SAVE_KEY = 'tomoshibi:save:v1', SET_KEY = 'tomoshibi:settings:v1', BEST_KEY = 'tomoshibi:best:v1';
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const fmt = (n) => Math.floor(n).toLocaleString('ja-JP');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
};
function dayKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function hashStr(s) { let h = 2166136261 >>> 0; for (const ch of String(s)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRand(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ================= data ================= */
const RES = { wood: '🪵', stone: '🪨', food: '🍞', shards: '✦' };
const RES_KEYS = ['wood', 'stone', 'food', 'shards'];
const DEF = {
  house: { name: '家', icons: ['🛖', '🏠', '🏡'], terrain: ['g'], workers: 0, unlock: 1, hp: [40, 60, 80], cat: 'home',
    cost: [{ wood: 20 }, { wood: 30, stone: 10 }, { wood: 45, stone: 25 }], cap: [3, 5, 7],
    desc: '住める人数が増える。空きがあれば、毎朝新しい住民がやってくる。' },
  farm: { name: '畑', icons: ['🌱', '🌾', '🌽'], terrain: ['g'], workers: 1, unlock: 1, hp: [30, 45, 60], cat: 'prod',
    cost: [{ wood: 15 }, { wood: 25, stone: 5 }, { wood: 40, stone: 15 }], prod: { food: [7, 12, 18] },
    desc: '毎朝、食料がとれる。住民は1人につき毎日1つ食料を食べる。' },
  lumber: { name: '木こり小屋', icons: ['🪓', '🪓', '🪓'], terrain: ['f'], workers: 1, unlock: 1, hp: [35, 50, 65], cat: 'prod',
    cost: [{ wood: 10 }, { wood: 25, stone: 8 }, { wood: 40, stone: 20 }], prod: { wood: [14, 22, 32] },
    desc: '森のマスに建てる。毎朝、木がとれる。' },
  quarry: { name: '石切り場', icons: ['⛏️', '⛏️', '⛏️'], terrain: ['r'], workers: 1, unlock: 1, hp: [40, 60, 80], cat: 'prod',
    cost: [{ wood: 25 }, { wood: 30, stone: 10 }, { wood: 45, stone: 25 }], prod: { stone: [8, 13, 19] },
    desc: '岩場のマスに建てる。毎朝、石がとれる。' },
  wall: { name: '柵', lvNames: ['木の柵', '石の壁', '鉄の壁'], icons: ['🚧', '🧱', '🛡️'], terrain: ['g', 'f', 'r'], workers: 0, unlock: 1, hp: [70, 180, 350], cat: 'wall',
    cost: [{ wood: 6 }, { stone: 12 }, { stone: 25, shards: 3 }],

function genTerrain(seed) {
  const rand = makeRand(seed);
  const t = Array(COLS * ROWS).fill('g');
  const dist = (i) => { const [c, r] = tileXY(i); return Math.hypot(c - CX, r - CY); };
  const blob = (n, kind, rmin, rmax) => {
    for (let k = 0; k < n; k++) {
      let x, y;
      do { x = rand() * COLS; y = rand() * ROWS; } while (Math.hypot(x - CX - 0.5, y - CY - 0.5) < 2);
      const rad = rmin + rand() * (rmax - rmin);
      for (let i = 0; i < t.length; i++) {
        const [c, r] = tileXY(i);
        if (Math.hypot(c + 0.5 - x, r + 0.5 - y) < rad * (0.75 + rand() * 0.5)) t[i] = kind;
      }
    }
  };
  blob(4, 'f', 1.0, 1.8);
  blob(3, 'r', 0.8, 1.3);
  for (let i = 0; i < t.length; i++) if (dist(i) < 1.5) t[i] = 'g';
  const near = []; for (let i = 0; i < t.length; i++) { const d = dist(i); if (d >= 1.5 && d <= 2.5) near.push(i); }
  for (let i = near.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [near[i], near[j]] = [near[j], near[i]]; }
  const ensure = (kind, n) => { let have = near.filter((i) => t[i] === kind).length; for (const i of near) { if (have >= n) break; if (t[i] === 'g') { t[i] = kind; have++; } } };
  ensure('f', 2); ensure('r', 1);
  let grassNear = near.filter((i) => t[i] === 'g').length;
  for (const i of near) { if (grassNear >= 6) break; if (t[i] !== 'g') { t[i] = 'g'; grassNear++; } }
  return t.map((k) => ({ t: k, b: null }));
}

    rows.push(['焼くダメージ', arrow(`${d.aura.dps[b.lv - 1]}/秒`, nx >= 0 ? `${d.aura.dps[nx]}/秒` : null)]);
  }
  if (b.k === 'wall' && nx >= 0) rows.push(['強化すると', `${d.lvNames[nx]}（耐久${d.hp[nx]}）`]);
  return rows;
}
function openInfo(i) {
  const b = S.grid[i].b; if (!b) return;
  selected = i;
  const rowsHtml = (rows) => `<div class="rows">${rows.map(([a, z]) => `<div><span>${a}</span><b>${z}</b></div>`).join('')}</div>`;
  if (b.k === 'lantern') {
    const c = LANTERN.cost[b.lv];
    const unlocks = c ? BUILD_ORDER.filter((k) => DEF[k].unlock === b.lv + 1).map((k) => DEF[k].name) : [];
    if (c && b.lv + 1 <= 3) unlocks.push(`建物の強化Lv${b.lv + 1}`);
    openSheet({
      title: `大灯籠 Lv${b.lv}`, icon: '🏮', kicker: '村の中心',
      html: `<p>村を照らすともしび。光の届くマスにだけ建物を建てられる。この灯が消えると村は闇にのまれる。</p>${rowsHtml(statRows(b))}${unlocks.length ? `<p class="note">次のLvで解放：${unlocks.join('、')}</p>` : ''}`,
      actions: [
        c ? { label: `強化してLv${b.lv + 1}に`, sub: canAfford(c) ? costStr(c) : `${costStr(c)}（${lackStr(c)}）`, cls: 'btn-amber', disabled: !canAfford(c) || mode !== 'day', onClick: () => { upgrade(i); openInfo(i); return false; } }
          : { label: '最大レベルです', disabled: true },
        { label: '閉じる' },
      ],
      onClose: () => { selected = -1; },
    });
    return;
  }
  const d = DEF[b.k];
  let status, cls;
  if (b.broken) { status = 'がれき：修理するまで働かない'; cls = 'bad'; }
  else if (d.workers) { if (STAFF.staffed.has(i)) { status = `稼働中（住民${d.workers}人）`; cls = 'ok'; } else { status = `人手不足：住民があと${d.workers}人必要。家を建てて住民を増やそう`; cls = 'bad'; } }
  else { status = '稼働中'; cls = 'ok'; }
  const acts = [];
  if (b.broken) {
    const rc = repairCost(b);
    acts.push({ label: '修理する', sub: canAfford(rc) ? costStr(rc) : `${costStr(rc)}（${lackStr(rc)}）`, cls: 'btn-amber', disabled: !canAfford(rc) || mode !== 'day', onClick: () => { repair(i); openInfo(i); return false; } });
  } else if (b.lv < 3) {
    const c = d.cost[b.lv], locked = b.lv >= maxLv();
    acts.push({ label: `強化してLv${b.lv + 1}に`, sub: locked ? `大灯籠Lv${b.lv + 1}が必要` : canAfford(c) ? costStr(c) : `${costStr(c)}（${lackStr(c)}）`, cls: 'btn-amber', disabled: locked || !canAfford(c) || mode !== 'day', onClick: () => { upgrade(i); openInfo(i); return false; } });
  } else acts.push({ label: '最大レベルです', disabled: true });
  acts.push({ label: '取りこわす', sub: '建てた費用の半分が戻る', cls: 'btn-danger', disabled: mode !== 'day', onClick: (btn) => {
    if (btn.dataset.armed) { demolish(i); return; }
    btn.dataset.armed = '1'; btn.querySelector('span').textContent = 'もう一度押すと取りこわす'; return false;
  } });
  acts.push({ label: '閉じる' });
  openSheet({
    title: `${bName(b)} Lv${b.lv}`, icon: bIcon(b),
    html: `<p class="status ${cls}">${status}</p><p>${d.desc}</p>${rowsHtml(statRows(b))}`,
    actions: acts, onClose: () => { selected = -1; },
  });
}
function openHowTo(first = false) {
  openSheet({
    kicker: first ? 'ようこそ' : 'あそびかた', title: 'ともしびの村の暮らし', dismissable: !first,
    html: `<ol class="steps">
      <li><span class="n">昼</span><div><b>光の届く場所に建物を建てる</b><p>家・畑・木こり小屋などを建てて村を育てる。木・石・食料は毎朝まとめて手に入る。昼に時間制限はない。</p></div></li>
      <li><span class="n">夜</span><div><b>影から大灯籠を守る</b><p>影は灯をめざしてまっすぐ来る。柵でふさぎ、見張り塔で倒そう。影をタップしても攻撃できる。</p></div></li>
      <li><span class="n">人</span><div><b>住民と食料のバランス</b><p>畑や見張り塔を動かすには住民が必要。住民は毎日1つ食料を食べる。</p></div></li>
    </ol>
    <p class="note">灯が消えても、その日の朝からやり直せます。上の「目標」をこなすと、つぎにやることが分かります。</p>`,
    actions: [{ label: first ? 'はじめる' : '閉じる', cls: 'btn-amber' }],
  });
}
function openMenu() {
  openSheet({
    kicker: 'メニュー', title: `${S.day}日目`,
    html: `<div class="rows"><div><span>最高記録</span><b>${best}日 生存</b></div><div><span>これまでに倒した影</span><b>${fmt(S.stats.kills)}体</b></div></div>`,
    actions: [
      { label: `効果音：${SET.sound ? 'オン' : 'オフ'}`, onClick: (btn) => { SET.sound = !SET.sound; saveSet(); btn.querySelector('span').textContent = `効果音：${SET.sound ? 'オン' : 'オフ'}`; return false; } },
      { label: 'あそびかた', onClick: () => { setTimeout(() => openHowTo(false), 0); } },
      { label: mode === 'night' ? 'タイトルへ（今夜は最初からになります）' : 'タイトルへ（村は保存されます）', onClick: () => { toTitle(); } },
      { label: '閉じる', cls: 'btn-amber' },
    ],
  });
}

/* ================= HUD rendering ================= */
function renderAll() { renderHud(); renderQuest(); if (mode !== 'night') { renderCards(); renderHint(); } }
function renderHud() {
  $('dayNum').textContent = `${S.day}日目`;
  const isNight = mode === 'night';
  $('phase').textContent = isNight ? '夜' : '昼'; $('phase').classList.toggle('night', isNight);
  const p = production(), dlt = { wood: p.wood, stone: p.stone, food: p.food - S.pop };
  for (const k of ['wood', 'stone', 'food']) {
    $('v-' + k).textContent = fmt(S.res[k]);
    const el = $('d-' + k), v = dlt[k];
    el.textContent = `${v >= 0 ? '+' : ''}${v}/日`; el.className = 'd' + (v > 0 ? ' up' : v < 0 ? ' down' : '');
  }
  $('v-shards').textContent = fmt(S.res.shards);
  $('v-pop').textContent = `${S.pop}/${capacity()}`;
  const dp = $('d-pop');
  if (STAFF.need > S.pop) { dp.textContent = `人手-${STAFF.need - S.pop}`; dp.className = 'd down'; }
  else { dp.textContent = `空き${STAFF.free}`; dp.className = 'd' + (STAFF.free > 0 ? ' up' : ''); }
}
function renderQuest() {
  const box = $('quest'), isNight = mode === 'night';
  box.classList.toggle('nightq', isNight);
  if (isNight) {
    $('qLabel').textContent = '夜'; $('qText').textContent = '大灯籠を守りぬけ'; $('qReward').textContent = '影をタップしても攻撃できる';
    $('qClaim').hidden = true; return;
  }
  const q = QUESTS[S.quest];
  if (!q) {
    $('qLabel').textContent = '挑戦'; $('qText').textContent = 'どこまで生き延びられるか'; $('qReward').textContent = `最高記録 ${best}日`; $('qClaim').hidden = true; return;
  }
  const done = q.done();
  $('qLabel').textContent = done ? '目標達成' : `目標 ${S.quest + 1}`;
  $('qText').textContent = q.text; $('qReward').textContent = `報酬 ${costStr(q.reward)}`;
  $('qClaim').hidden = !done;
}
function renderCards() {
  const lv = lanternLv(), lc = LANTERN.cost[lv];
  const html = [`<button class="card lamp ${lc && !canAfford(lc) ? 'poor' : ''}" type="button" data-k="lantern"><span class="ic">🏮</span><span class="nm">灯籠 Lv${lv}</span><span class="cs">${lc ? (canAfford(lc) ? '強化できる' : '強化：資源不足') : '最大Lv'}</span></button>`];
  for (const k of BUILD_ORDER) {
    const d = DEF[k], locked = lv < d.unlock, c = d.cost[0];
    const cls = ['card', locked ? 'locked' : '', !locked && !canAfford(c) ? 'poor' : '', placing === k ? 'active' : ''].join(' ');
    html.push(`<button class="${cls}" type="button" data-k="${k}"><span class="ic">${d.icons[0]}</span><span class="nm">${d.name}</span><span class="cs">${locked ? `灯籠Lv${d.unlock}で解放` : costStr(c)}</span></button>`);
  }
  $('cards').innerHTML = html.join('');
}
function renderHint() {
  const f = forecast();
  const idleDef = S.grid.some((t, i) => t.b && !t.b.broken && (t.b.k === 'tower' || t.b.k === 'catapult') && !STAFF.staffed.has(i));
  $('nightSub').textContent = idleDef ? '⚠ 人手不足の塔あり' : `影 ${f.n}体${f.note ? '・' + f.note : ''}`;
  let h;
  const p = production();
  if (placing) h = `<b>${DEF[placing].name}</b>：${DEF[placing].desc}`;
  else if (S.res.food + p.food - S.pop < 0) h = '<span class="warn">明日の朝、食料が足りなくなります。畑を建てるか強化しよう。</span>';
  else if (STAFF.need > S.pop) h = '<span class="warn">人手不足の建物があります（地図の「!」）。住民は畑→木こり→石切り→塔の順に働きます。家を建てて住民を増やそう。</span>';
  else if (S.pop >= capacity() && S.day > 1) h = '家がいっぱいです。家を建てると、毎朝新しい住民がやってきます。';
  else h = TIPS[(S.day - 1) % TIPS.length];
  $('hint').innerHTML = h;
}
const npCache = {};
function renderNightPanel(force = false) {
  if (!night) return;
  const lb = lanternB(), mh = maxHp(lb), hp = Math.max(0, Math.ceil(lb.hp));
  const set = (id, prop, val) => { const k = id + prop; if (!force && npCache[k] === val) return; npCache[k] = val; const el = $(id); if (prop === 'text') el.textContent = val; else if (prop === 'width') el.style.width = val; else el.style.setProperty(prop, val); };
  set('lampBar', 'width', `${(hp / mh) * 100}%`);
  set('lampText', 'text', `${fmt(hp)} / ${mh}`);
  set('waveText', 'text', `影 のこり ${night.total - night.kills} ・ 倒した ${night.kills}`);
  for (let k = 0; k < 2; k++) {
    const cd = night.skill[k], btn = $('skill' + k);
    set('skill' + k, '--cd', String(cd / SKILLS[k].cd));
    set('sk' + k + 't', 'text', cd > 0 ? `${Math.ceil(cd)}秒` : '');
    btn.disabled = cd > 0;
  }
  set('speedBtn', 'text', `×${SET.speed}`);
}

/* ================= input ================= */
let downP = null;
cv.addEventListener('pointerdown', (e) => { sfx.unlock(); downP = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
cv.addEventListener('pointerup', (e) => {
  if (!downP || downP.id !== e.pointerId) return;
  const moved = Math.hypot(e.clientX - downP.x, e.clientY - downP.y); downP = null;
  if (moved > 14) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  tapMap(px, py);
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());
function tapMap(px, py) {
  if (!S) return;
  const u = (px - mx) / cs, v = (py - my) / cs;
  if (mode === 'night' && night && !night.ended) {
    let tgt = null, bd = 0.85;
    for (const e of night.foes) { const d = Math.hypot(e.x - u, e.y - v); if (d < bd) { bd = d; tgt = e; } }
    if (tgt) { damage(tgt, 3 + lanternLv()); burst(px, py, 6, ['#fff3d6', '#ffcf6b'], { sp: 90, s: 3, life: 300, top: true }); sfx.zap(); haptic(6); }
    return;
  }
  if (mode !== 'day') return;
  const c = Math.floor(u), r = Math.floor(v);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) { cancelPlacing(); return; }
  const i = r * COLS + c, t = S.grid[i];
  if (placing) {
    const k = placing;
    if (t.b) { toast('ここにはもう建物があります'); return; }
    if (!inLight(i)) { toast('光の届かない場所には建てられません'); return; }
    if (!DEF[k].terrain.includes(t.t)) { toast(`${DEF[k].name}は${DEF[k].terrain.map((x) => TERRAIN_NAME[x]).join('・')}のマスに建てられます`); return; }
    if (!canAfford(DEF[k].cost[0])) { toast(`資源が足りません（${lackStr(DEF[k].cost[0])}）`); cancelPlacing(); return; }
    build(k, i);
    if (k !== 'wall' || !canAfford(DEF[k].cost[0])) cancelPlacing();
    return;
  }
  if (t.b) { sfx.tap(); openInfo(i); return; }
  if (!inLight(i)) toast('闇の中です。大灯籠を強化すると光が広がります');
  else toast(`${TERRAIN_NAME[t.t]}：${t.t === 'f' ? '木こり小屋や柵を建てられます' : t.t === 'r' ? '石切り場や柵を建てられます' : '家・畑・塔などを建てられます'}`);
}
$('cards').addEventListener('click', (e) => {
  const el = e.target.closest('.card'); if (!el || mode !== 'day') return;
  sfx.unlock(); sfx.tap();
  const k = el.dataset.k;
  if (k === 'lantern') { cancelPlacing(); openInfo(LI); return; }
  const d = DEF[k];
  if (lanternLv() < d.unlock) { toast(`大灯籠をLv${d.unlock}にすると建てられます`); return; }
  if (placing === k) { cancelPlacing(); return; }
  if (!canAfford(d.cost[0])) { toast(`資源が足りません（${lackStr(d.cost[0])}）`); return; }
  setPlacing(k);
});
$('placeCancel').addEventListener('click', cancelPlacing);
$('nightBtn').addEventListener('click', () => { sfx.unlock(); startNight(); });
$('qClaim').addEventListener('click', claimQuest);
$('menuBtn').addEventListener('click', () => { if (mode === 'day' || mode === 'night') { sfx.tap(); openMenu(); } });
$('skill0').addEventListener('click', () => useSkill(0));
$('skill1').addEventListener('click', () => useSkill(1));
$('speedBtn').addEventListener('click', () => { SET.speed = SET.speed === 1 ? 2 : 1; saveSet(); renderNightPanel(true); sfx.tap(); });

/* ================= screens & loop ================= */
function frame(t) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
  dusk += (duskTarget - dusk) * Math.min(1, dt * 2.2);
  if (mode === 'night' && night && !night.ended && $('sheetWrap').hidden) {
    let left = dt * SET.speed;
    while (left > 0 && !night.ended) { const st = Math.min(left, 0.025); updateNight(st); left -= st; }
    if (night && !night.ended) renderNightPanel();
  } else lampHurt = Math.max(0, lampHurt - dt);
  draw(t, dt);
}
function showGame() {
  $('title').hidden = true; $('game').hidden = false;
  resize();
  if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); }
}
function toTitle() {
  if (mode === 'night') { night = null; }
  if (S && mode === 'day') save(); // a night in progress is never saved; the village resumes at that evening
  mode = 'title'; placing = null; selected = -1; night = null;
  cancelAnimationFrame(rafId); rafId = 0;
  closeSheet();
  $('game').hidden = true; $('title').hidden = false;
  renderTitle();
}
function renderTitle() {
  const saved = loadGame();
  const cb = $('continueBtn'), nb = $('newBtn');
  if (saved) { cb.hidden = false; cb.innerHTML = `<span>つづきから</span><small>${saved.day}日目 ・ 住民${saved.pop}人</small>`; nb.className = 'btn'; }
  else { cb.hidden = true; nb.className = 'btn btn-amber'; }
  nb.textContent = '新しい村をはじめる'; delete nb.dataset.armed;
  $('titleBest').textContent = best > 0 ? `最高記録：${best}日 生き延びた` : '';
}
function startNewVillage() {
  newGame(); night = null; fx.parts = []; fx.floats = []; fx.rings = []; popAt.clear();
  showGame(); enterDay(); terrainC = null;
  openHowTo(true);
}
$('continueBtn').addEventListener('click', () => {
  sfx.unlock();
  S = loadGame(); if (!S) { renderTitle(); return; }
  showGame(); terrainC = null;
  if (S.pendingEvent) { mode = 'report'; STAFF = staffing(); renderAll(); showEvent(S.pendingEvent); }
  else enterDay();
});
$('newBtn').addEventListener('click', () => {
  sfx.unlock();
  const nb = $('newBtn');
  if (loadGame() && !nb.dataset.armed) { nb.dataset.armed = '1'; nb.textContent = 'もう一度押すと新しく始めます（今の村は消えます）'; return; }
  startNewVillage();
});
window.addEventListener('resize', () => { if (!$('game').hidden) resize(); });
if ('ResizeObserver' in window) new ResizeObserver(() => { if (!$('game').hidden) resize(); }).observe(stage);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && mode === 'day') save(); });
window.addEventListener('pagehide', () => { if (S && mode === 'day') save(); });
if (document.fonts && document.fonts.load) { document.fonts.load('20px "Zen Kaku Gothic New"').catch(() => {}); }
renderTitle();
</script>
