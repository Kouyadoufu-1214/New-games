<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>恋普請 城下町と四つの花</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ひょんなことから領地を賜った侍が、四人のヒロインと城下町を築く。街づくりと恋愛のシミュレーション">
<meta name="theme-color" content="#efe6d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="恋普請">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: an Edo-period town map (城下絵図) fills the screen; a slim almanac bar sits on top and an order bar
     (道・建てる・撤去・帳簿) docks at the bottom. One paper-and-ink world by design. */
  color-scheme:light;
  --paper:#efe6d2; --paper-2:#e4d7ba; --paper-3:#f8f2e4; --ink:#2b2622; --ink-soft:#6c6257; --line:#cbbb98;
  --shu:#b23c2a; --shu-deep:#842a1c; --ai:#2f4f6f; --matcha:#58733a; --gold:#a97c22;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:manipulation;font-weight:900;font-size:14px;line-height:1.3;
  background:var(--paper-3);color:var(--ink);box-shadow:0 3px 0 #cdbd99;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 #cdbd99}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{font-size:11px;font-weight:700;opacity:.8}
.btn-shu{background:var(--shu);border-color:var(--shu-deep);color:#fbf4e6;box-shadow:0 3px 0 var(--shu-deep)}
.btn-shu:active:not([disabled]){box-shadow:0 1px 0 var(--shu-deep)}
.btn-ai{background:var(--ai);border-color:#1f3650;color:#f3eee2;box-shadow:0 3px 0 #1f3650}
.btn:focus-visible,.tool:focus-visible,.seg button:focus-visible,.card:focus-visible{outline:3px solid var(--ai);outline-offset:2px}

/* title */
.t-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.t-actions .btn{padding:14px;font-size:16px}

/* game frame */
#game{height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(180deg,#f6efde,#ece2c9);border-bottom:1px solid var(--line);padding-block:6px 6px;display:flex;flex-direction:column;gap:6px;z-index:2}
.top-row{display:flex;align-items:center;gap:8px}
.date{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.date b{font-family:var(--font-display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date span{font-size:11.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.date b{font-size:14px}.stat{min-width:38px;padding:3px 4px}.stat b{font-size:12.5px}}
.stats{display:flex;gap:5px;margin-left:auto}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;background:var(--paper-3);border:1px solid var(--line);border-radius:10px;padding:3px 6px;min-width:42px}
.stat i{font-style:normal;font-size:10px;color:var(--ink-soft);font-weight:700}
.stat b{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:900}
.stat b.bad{color:var(--shu)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-3)}
.seg button{border:0;background:none;padding:7px 6px;font-size:11px;font-weight:900;cursor:pointer;min-width:28px;touch-action:manipulation;letter-spacing:-.1em}
.seg button.on{background:var(--ink);color:var(--paper-3)}
.goal{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper-3);border:1px solid var(--line);border-left:4px solid var(--shu);border-radius:10px;padding:5px 10px;cursor:pointer;text-align:left;width:100%}
.goal .g-ch{font-family:var(--font-display);font-weight:800;font-size:12.5px;white-space:nowrap}
.goal .g-t{font-size:12.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .g-n{font-size:12px;font-weight:900;color:var(--shu);white-space:nowrap}
.stage{flex:1;min-height:0;position:relative;touch-action:none;background:#d8cba9;overflow:hidden}
#cv,#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.rot{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px}
.rot button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(248,242,228,.92);font-size:19px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 #cdbd99;display:grid;place-items:center;padding:0}
.rot button:active{transform:translateY(1px)}
.placebar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-block:8px;background:rgba(248,242,228,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.placebar .pb-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.placebar .pb-t b{font-size:14px}
.placebar .pb-t span{font-size:12px;color:var(--ink-soft);font-weight:700}
.placebar .pb-t span.bad{color:var(--shu)}
.placebar .btn{padding:9px 14px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:6px 6px;background:linear-gradient(180deg,#ece2c9,#e6d9bc);border-top:1px solid var(--line);z-index:2}
.tool{border:1px solid var(--line);background:var(--paper-3);border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;touch-action:manipulation;font-weight:900;font-size:11.5px}
.tool svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}
.tool.on svg{stroke:var(--paper-3)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-140%);z-index:6;background:var(--ink);color:var(--paper-3);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:99px;
  width:max-content;max-width:calc(100% - 120px);text-align:center;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,38,34,.22);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:calc(40px + env(safe-area-inset-top,0px))}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--paper-3);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(43,38,34,.2);animation:rise .28s cubic-bezier(.2,1.2,.4,1) both;
  background-image:repeating-linear-gradient(0deg,rgba(150,120,70,.035) 0 1px,transparent 1px 4px)}
.sheet.short{max-height:62%}
.sheet>*{flex-shrink:0}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-icon{width:42px;height:42px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;color:#fbf4e6;border:1px solid rgba(0,0,0,.25)}
.sh-title{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.25}
.sh-kick{font-size:11.5px;font-weight:900;color:var(--shu);letter-spacing:.06em}
.sh-x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;flex:none}
.status{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#e8efd9;color:#3e5523}
.status.warn{background:#f6e0d6;color:var(--shu-deep)}
.desc{font-size:13px;color:var(--ink-soft);line-height:1.6}
.rows{display:flex;flex-direction:column;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.rows span{color:var(--ink-soft);font-weight:700}
.rows b{font-variant-numeric:tabular-nums;text-align:right}
.rows .sub{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.bar{height:7px;border-radius:99px;background:#e1d5b8;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:inherit}
.prow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.prow span{min-width:44px;font-weight:700}
.prow b{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.sec{font-family:var(--font-display);font-weight:800;font-size:14px;margin-top:2px}
.segrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.segrow .seg button{padding:7px 10px;font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-weight:900;font-size:12.5px;cursor:pointer}
.cats button.on{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:7px}
.card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.card .c-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.card .c-main b{font-size:14px}
.card .c-main span{font-size:11.5px;color:var(--ink-soft)}
.card .c-cost{font-size:11.5px;font-weight:900;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.card.locked{opacity:.5}
.trade{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.trow .seg button{padding:6px 8px;font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper-3);font-weight:900;cursor:pointer}
.step b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.talk{display:flex;gap:12px;align-items:flex-start}
.face{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:24px;border:2px solid var(--ink);background:var(--paper)}
.talk .who{font-size:12px;font-weight:900;color:var(--ink-soft)}
.talk p{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.8}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:700;line-height:1.45}
.goals li i{font-style:normal;width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-size:12px;margin-top:1px}
.goals li.ok{color:var(--ink-soft)}
.goals li.ok i{background:var(--matcha);border-color:var(--matcha);color:#fff}
.note{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;line-height:1.6}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== 恋普請: boot / opening / title / clouds ===== */
input{-webkit-user-select:text;user-select:text;font:inherit}
.pt{width:100%;height:100%;display:block;overflow:visible}
img.pt{object-fit:contain;object-position:50% 100%;image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;pointer-events:none}
@supports (image-rendering:pixelated){img.pt{image-rendering:pixelated}}
.boot{position:fixed;inset:0;z-index:60;background:#fffdf6;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.boot-in b{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.4em;color:#a8844a}
.boot-in p{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:.18em;animation:blink 1.8s ease-in-out infinite}
.boot-in small{color:var(--ink-soft);font-weight:700}
.op{position:fixed;inset:0;z-index:50;overflow:hidden;background:#fffaf0;cursor:pointer;touch-action:manipulation}
.op-flash{position:absolute;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff 0 45%,#fff8e0 100%);animation:flash 1.7s ease-out both}
.op-skip{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;font-size:11px;font-weight:900;color:rgba(80,60,40,.55);letter-spacing:.1em;pointer-events:none}
.op.dark .op-skip{color:rgba(255,240,230,.55)}
.op-sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:opIn .45s ease both}
.op-sc.out{animation:opOut .45s ease both}
.op-bean{width:min(26vw,110px);animation:roll 1.5s cubic-bezier(.22,.9,.3,1) both;filter:drop-shadow(0 6px 6px rgba(120,80,30,.25))}
.op-bean svg{width:100%;display:block}
.op-logo{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,8.4vw,42px);letter-spacing:.28em;color:#6a4a22;margin-top:18px;padding-left:.28em}
.op-logo span{display:inline-block;opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.op-en{font-size:11px;letter-spacing:.6em;color:#b0905a;font-weight:900;margin-top:6px;opacity:0;animation:fadeIn .6s 2s both;padding-left:.6em}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.logo .lg-ruby{font-size:12px;letter-spacing:.9em;font-weight:900;color:#9a3a4a;padding-left:.9em}
.logo .lg-main{font-family:var(--font-display);font-weight:800;font-size:clamp(60px,19vw,92px);line-height:1.02;letter-spacing:.04em;
  background:linear-gradient(180deg,#3a1a28 0%,#8a2438 52%,#e0607a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 6px 12px rgba(160,40,80,.3))}
.logo .lg-sub{font-family:var(--font-display);font-weight:800;font-size:clamp(15px,4.6vw,20px);color:#4a2230;letter-spacing:.14em;text-shadow:0 1px 0 #fff,0 0 8px #fff}
.logo .lg-fl{display:flex;gap:8px;margin-top:4px}
.logo .lg-fl svg{width:20px;height:20px}
.op-title-sc .logo{animation:logoIn 1.1s cubic-bezier(.2,1,.3,1) both}
.op-hero{overflow:hidden}
.op-hero .band{position:absolute;inset:-20% -30%;transform:skewY(-9deg);background:linear-gradient(110deg,var(--hb) 0 46%,var(--hc) 46% 49%,var(--hb) 49%);animation:bandIn .45s cubic-bezier(.2,1,.3,1) both}
.op-hero .op-pt{position:absolute;bottom:-2%;right:-10%;height:min(68%,130vw);aspect-ratio:200/240;animation:slideL .65s cubic-bezier(.2,1,.3,1) both}
.op-hero .op-pt.lft{right:auto;left:-10%;animation-name:slideR}
.op-hero .cap{position:absolute;left:7%;top:calc(6% + env(safe-area-inset-top,0px));max-width:min(70%,420px);display:flex;flex-direction:column;gap:4px;animation:capIn .6s .15s cubic-bezier(.2,1,.3,1) both}
.op-hero .cap.rt{left:auto;right:7%;align-items:flex-end;text-align:right}
.op-hero .cap small{font-weight:900;font-size:12px;color:var(--hc);letter-spacing:.1em;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 2px #fff}
.op-hero .cap b{font-family:var(--font-display);font-weight:800;font-size:clamp(48px,14vw,72px);line-height:1;color:#2b1d22;text-shadow:3px 3px 0 #fff}
.op-hero .cap i{font-style:normal;font-weight:900;font-size:13px;color:var(--hc);letter-spacing:.4em}
.op-hero .cap q{quotes:"「" "」";font-family:var(--font-display);font-weight:800;font-size:clamp(14px,4.2vw,18px);color:#2b1d22;background:rgba(255,255,255,.85);border-radius:10px;padding:6px 10px;margin-top:8px;line-height:1.6}
.op-trio{background:linear-gradient(180deg,#f3e4c8,#e8d2a8)}
.op-trio .row{display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:560px;margin-bottom:8vh;gap:0}
.op-trio .tp{position:relative;flex:none;width:46%;aspect-ratio:200/240;animation:rise .6s cubic-bezier(.2,1.2,.4,1) both}
.op-trio .tp.big{width:62%;z-index:2;margin:0 -16%}
.op-trio .tp span{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px}
.op-cap{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--font-display);font-weight:800;font-size:clamp(17px,5vw,22px);letter-spacing:.14em;color:#2b1d22;text-shadow:0 1px 0 #fff,0 0 10px #fff;animation:capIn .7s .2s both;padding:0 16px}
.op-cap.lt{color:#fff3e8;text-shadow:0 2px 8px #000}
.op-people{background:radial-gradient(circle at 50% 40%,#fff6e4,#ecd9b4)}
.op-people .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(94vw,460px)}
.op-people .pp{position:relative;aspect-ratio:160/200;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#fff,#f0e2c4);border:2px solid #fff;box-shadow:0 3px 8px rgba(80,50,20,.2);animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.op-people .pp span{position:absolute;left:0;right:0;bottom:0;background:rgba(43,38,34,.78);color:#fff;font-size:10.5px;font-weight:900;text-align:center;padding:2px 0}
.op-dark{background:radial-gradient(circle at 50% 45%,#4a0c1e 0%,#1a060c 60%,#080204 100%)}
.op-dark .dk{position:absolute;aspect-ratio:200/240;animation:darkIn .7s cubic-bezier(.2,1,.3,1) both}
.op-dark .dk-c{height:62%;left:50%;top:6%;transform:translateX(-50%);z-index:3;animation-name:darkInC}
.op-dark .dk-l{height:46%;left:-14%;top:22%;z-index:2;animation-delay:.15s;filter:brightness(.8)}
.op-dark .dk-r{height:46%;right:-14%;top:22%;z-index:2;animation-delay:.15s;filter:brightness(.8)}
.op-dark .dk-r .pt{transform:scaleX(-1)}
.op-dark .dk-bl{height:34%;left:-4%;bottom:12%;z-index:4;animation-delay:.35s}
.op-dark .dk-br{height:34%;right:-4%;bottom:12%;z-index:4;animation-delay:.35s}
.op-dark .dk-br .pt{transform:scaleX(-1)}
.op-dark::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.6));pointer-events:none;z-index:5}
.op-dark .op-cap{z-index:6}
.op-battle{background:linear-gradient(160deg,#2a1a30 0%,#6a2a2a 55%,#1a1010 100%)}
.op-battle .ob{position:absolute;bottom:18%;height:min(50%,110vw);aspect-ratio:200/240;transition:opacity .2s}
.op-battle .ob.l{left:-18%;animation:dashL .5s cubic-bezier(.2,1,.3,1) both}
.op-battle .ob.r{right:-18%;animation:dashR .5s cubic-bezier(.2,1,.3,1) both}
.op-battle .ob.r .pt{transform:scaleX(-1)}
.op-battle .ob.p2{opacity:0}
.op-battle.ph2 .ob.p1{opacity:0}
.op-battle.ph2 .ob.p2{opacity:1;animation-delay:0s}
.op-battle .speed{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,255,255,.06) 22px 24px);animation:speed .4s linear infinite;pointer-events:none}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.slash{position:absolute;left:-20%;right:-20%;top:46%;height:7px;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 18px #fff,0 0 40px #ffd0d0;transform:rotate(-22deg) scaleX(0);animation:slash .32s ease-out both}
.slash.b{transform:rotate(18deg) scaleX(0);top:40%;animation-name:slashB}
.whit{position:absolute;inset:0;background:#fff;animation:whit .35s ease-out both}
.kanji{position:absolute;font-family:var(--font-display);font-weight:800;font-size:clamp(70px,22vw,110px);line-height:1;color:#fff;-webkit-text-stroke:3px #b23c2a;paint-order:stroke;text-shadow:0 0 20px rgba(255,80,80,.8);animation:kanji .7s ease-out both}
.op-town{background:#fbe6cf;overflow:hidden}
.op-town .pano{position:absolute;inset:0;transform-origin:38% 46%;animation:zoomOut 2.8s cubic-bezier(.25,.6,.2,1) both}
.op-town .pano svg,.ti-bg svg{width:100%;height:100%;display:block}
.op-final{background:transparent}
.op-final .logo{animation:logoIn 1s cubic-bezier(.2,1,.3,1) both;margin-bottom:18vh}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.petals i{position:absolute;top:-6%;width:11px;height:8px;border-radius:80% 0 80% 0;background:#f6b2c6;opacity:.85;animation:petal linear infinite}
/* title */
#title{position:fixed;inset:0;overflow:hidden;background:#fbe6cf;z-index:1}
.ti-bg{position:absolute;inset:0}
.ti-sky{position:absolute;inset:0;pointer-events:none;z-index:1}
.ti-kite{position:absolute;top:12%;left:-14%;width:58px;animation:kite 9s linear both}
.ti-kite svg{width:100%;display:block}
.ti-main{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(26px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ti-logo{animation:logoIn 1s cubic-bezier(.2,1,.3,1) both}
.ti-heroes{position:absolute;left:0;right:0;bottom:196px;height:min(44%,380px);display:flex;justify-content:center;align-items:flex-end;z-index:2;pointer-events:none}
.ti-heroes .tih{height:100%;aspect-ratio:200/240;max-width:46%;margin:0 -11.5%;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both;filter:drop-shadow(0 6px 10px rgba(60,30,30,.25))}
.ti-heroes .tih.h1,.ti-heroes .tih.h2{z-index:2;height:106%}
.ti-heroes .tih.h0{animation-delay:.1s}.ti-heroes .tih.h1{animation-delay:.2s}.ti-heroes .tih.h2{animation-delay:.3s}.ti-heroes .tih.h3{animation-delay:.4s}
.ti-panel{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(255,250,240,.9);border:1px solid #e0c9a0;border-radius:18px;padding:14px 14px 10px;box-shadow:0 -6px 24px rgba(80,40,30,.18);animation:rise .6s .3s both}
.ti-panel .t-actions{max-width:none}
.ti-links{display:flex;gap:8px}
.ti-links button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:900;cursor:pointer;touch-action:manipulation}
.t-note{font-size:11px;color:var(--ink-soft)}
.clouds{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.clouds .cl{position:absolute;top:0;bottom:0;width:64%;transition:transform .6s cubic-bezier(.5,0,.6,1)}
.clouds .cl svg{width:100%;height:100%;display:block}
.clouds .cl.l{left:0}.clouds .cl.r{right:0}
.clouds.pre .cl.l,.clouds.open .cl.l{transform:translateX(-102%)}
.clouds.pre .cl.r,.clouds.open .cl.r{transform:translateX(102%)}
.clouds.pre .cl{transition:none}
.clouds.open .cl{transition:transform 1.8s cubic-bezier(.45,0,.2,1)}

/* ===== VN ===== */
.vn{position:fixed;inset:0;z-index:30;cursor:pointer;touch-action:manipulation;background:linear-gradient(180deg,rgba(40,24,30,.12),rgba(40,24,30,.5))}
.vn-char{position:absolute;left:0;right:0;bottom:120px;top:calc(20px + env(safe-area-inset-top,0px));display:flex;justify-content:center;align-items:flex-end;pointer-events:none;transition:filter .25s,opacity .25s}
.vn-char.dim{filter:brightness(.72) saturate(.85)}
.vn-pt{height:100%;max-height:560px;max-width:96%;aspect-ratio:200/240;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.vn-pt.in{animation:charIn .35s cubic-bezier(.2,1,.3,1) both}
.vn-box{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 20px);max-width:540px;min-height:136px;
  background:rgba(255,251,243,.97);border:2px solid #d2b37a;border-radius:16px;padding:22px 16px 26px;box-shadow:0 8px 28px rgba(40,20,20,.3),inset 0 0 0 4px rgba(255,255,255,.6)}
.vn-name{position:absolute;top:-15px;left:14px;color:#fff;font-weight:900;font-size:14px;padding:4px 16px;border-radius:99px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.vn-box p{font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.vn.nar .vn-box p{color:#5a4a3a}
.vn-face{position:absolute;right:12px;top:-34px;width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#dfe6f0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.vn-face:empty{display:none}
.vn-next{position:absolute;right:16px;bottom:6px;color:var(--shu);font-size:13px;animation:bob 1s ease-in-out infinite}
.vn-ch{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vn-ch:empty{display:none}
.vn-ch button{border:2px solid #d2b37a;background:linear-gradient(180deg,#fffaf0,#f4e6c8);border-radius:12px;padding:11px 12px;font-weight:900;font-size:14.5px;cursor:pointer;text-align:left;touch-action:manipulation;color:var(--ink)}
.vn-ch button:active{transform:translateY(1px)}
.vn-in{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:900;color:var(--ink-soft)}
.vn-in input{border:2px solid #d2b37a;border-radius:10px;padding:9px 12px;font-size:17px;font-weight:700;color:var(--ink);background:#fff}
.vn-wf{position:absolute;inset:0;background:#fff;pointer-events:none;animation:whit .6s ease-out both;z-index:3}
.vn.shake{animation:shake .35s}
.heartfx{position:fixed;left:50%;bottom:180px;z-index:70;transform:translateX(-50%);font-weight:900;font-size:20px;color:#e0406a;text-shadow:0 1px 0 #fff,0 0 8px #fff;pointer-events:none;animation:heartUp 1.4s ease-out both;white-space:nowrap}

/* ===== in-game additions ===== */
.lv{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:36px;border-radius:10px;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(180deg,#e0607a,#9a2a44);color:#fff;border:1px solid #7a1a34;padding:2px 4px;line-height:1;box-shadow:0 2px 0 #7a1a34}
.lv i{font-style:normal;font-size:8.5px;font-weight:900;letter-spacing:.05em;opacity:.9}
.lv b{font-size:15px;font-weight:900}
.lv .xpb{width:100%;height:4px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:2px;display:block}
.lv .xpb s{display:block;height:100%;width:0;background:#ffe27a;text-decoration:none}
.stat.kb b{color:var(--gold)}
@media (max-width:400px){.stats{gap:3px}.stat{min-width:36px;padding:3px 4px}.stat b{font-size:12.5px}.stat i{font-size:9.5px}.date b{font-size:14.5px}}
.tools{grid-template-columns:repeat(7,1fr);gap:4px}
.tool{font-size:11px;padding:5px 0 4px;letter-spacing:-.04em}
.tool svg{width:21px;height:21px}
.tool .dot{position:absolute;top:3px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--shu);border:1.5px solid #fff}
.tool{position:relative}
.secw{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;align-items:flex-end;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.placebar:not([hidden])~.secw,.placebar:not([hidden])~.secbub{display:none}
.secw .sw-face{width:60px;height:60px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 10px rgba(40,20,20,.3);background:var(--hb,#f0e0d0);flex:none}
.secw .sw-tag{display:flex;flex-direction:column;align-items:flex-start;background:rgba(255,255,255,.95);border-radius:0 99px 99px 0;padding:2px 10px 2px 10px;margin-left:-6px;margin-bottom:4px;line-height:1.15;box-shadow:0 2px 6px rgba(40,20,20,.2)}
.secw .sw-tag b{font-size:12.5px;font-weight:900}
.secw .sw-tag i{font-style:normal;font-size:10px;font-weight:900;color:#e0406a;letter-spacing:.05em}
.secw .sw-dot{position:absolute;left:44px;top:-4px;min-width:20px;height:20px;border-radius:99px;background:#e0406a;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid #fff;animation:pulse 1.2s ease-in-out infinite}
.secbub{position:absolute;left:12px;bottom:76px;z-index:3;max-width:min(270px,70%);background:#fff;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:12.5px;font-weight:700;line-height:1.5;box-shadow:0 3px 12px rgba(40,20,20,.25);animation:bubIn .3s cubic-bezier(.2,1.4,.4,1) both;cursor:pointer}
.secbub b{display:block;font-size:10.5px;color:var(--hc,#b23c2a)}
.evban{position:absolute;left:8px;top:64px;z-index:4;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#d0402e,#9a2a1c);color:#fff;border:2px solid #fff;border-radius:99px;
  padding:6px 13px 6px 9px;font-weight:900;font-size:12.5px;box-shadow:0 3px 10px rgba(120,20,20,.4);animation:pulse 1.1s ease-in-out infinite;cursor:pointer;touch-action:manipulation}
.lvfx{position:absolute;left:50%;top:38%;z-index:5;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:lvfx 2.2s ease-out both}
.lvfx b{display:block;font-size:34px;font-weight:900;letter-spacing:.06em;color:#fff;-webkit-text-stroke:2px #9a2a44;paint-order:stroke;text-shadow:0 4px 12px rgba(160,40,80,.5)}
.lvfx span{display:inline-block;margin-top:4px;background:#9a2a44;color:#fff;font-weight:900;font-size:13px;padding:3px 12px;border-radius:99px}

/* sheets: heroines, gacha, events */
.hcards{display:flex;flex-direction:column;gap:8px}
.hcard{position:relative;display:flex;gap:10px;align-items:stretch;border:2px solid var(--line);border-radius:14px;padding:0 10px 0 0;background:linear-gradient(100deg,var(--hb,#f0e0d0) 0 34%,var(--paper) 34%);text-align:left;width:100%;overflow:hidden}
.hcard.on{border-color:var(--hc)}
.hcard .hc-pt{width:34%;flex:none;aspect-ratio:140/150;align-self:flex-end}
.hcard .hc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:8px 0}
.hcard .hc-main>b{font-family:var(--font-display);font-size:19px;font-weight:800;line-height:1.1}
.hcard .hc-main>b small{font-family:var(--font-body);font-size:11px;font-weight:900;color:var(--hc);margin-left:6px}
.hcard .hc-on{position:absolute;right:8px;top:8px;background:var(--hc);color:#fff;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:99px}
.hcard .hc-acts{display:flex;gap:6px;margin-top:2px}
.hcard .hc-acts .btn{padding:6px 10px;font-size:12px;flex:1}
.hcard.locked{filter:grayscale(1);opacity:.6}
.st4{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.st4 span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:900}
.st4 i{font-style:normal;width:14px;color:var(--ink-soft)}
.st4 em{flex:1;height:6px;background:#e4d7ba;border-radius:9px;overflow:hidden}
.st4 em s{display:block;height:100%;background:var(--hc,var(--matcha));text-decoration:none;border-radius:inherit}
.st4 b{min-width:12px;text-align:right;font-size:11px}
.hc-sk{font-size:11.5px;line-height:1.45;color:var(--ink-soft);background:rgba(255,255,255,.6);border-radius:8px;padding:4px 7px}
.hc-sk b{color:var(--ink);margin-right:4px}
.sec-top{position:relative;display:flex;gap:10px;align-items:flex-end;margin:-16px -16px 0;padding:10px 16px 0;background:linear-gradient(180deg,var(--hb) 0,var(--paper-3) 100%);border-radius:18px 18px 0 0;overflow:hidden}
.sec-top .st-pt{width:44%;flex:none;aspect-ratio:200/220;margin-bottom:-2px}
.sec-top .st-pt .pt{height:110%}
.sec-top .st-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding-bottom:10px}
.sec-top .sh-title small{font-family:var(--font-body);font-size:11px;font-weight:900;color:var(--hc);margin-left:6px}
.sec-top .st-kind{font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.sec-top .sh-x{position:absolute;right:12px;top:12px}
.aff{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;color:#c0305a}
.aff em{flex:1;height:8px;background:#f2d6de;border-radius:9px;overflow:hidden}
.aff em s{display:block;height:100%;background:linear-gradient(90deg,#f08aa8,#e0406a);text-decoration:none}
.aff b{min-width:22px;text-align:right}
.skill{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--hc,var(--shu));border-radius:10px;padding:8px 10px;font-size:12.5px}
.skill small{color:var(--ink-soft);font-weight:700;font-size:11px}
.fi{display:inline-block;width:34px;height:34px;border-radius:50%;overflow:hidden;background:#efe2c8;border:2px solid #fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sil .pt{filter:brightness(0);opacity:.18}
.gbanner{position:relative;display:flex;justify-content:center;align-items:flex-end;height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#3a2a4a,#8a3a5a 60%,#e0a040)}
.gbanner span{height:100%;aspect-ratio:160/200;margin:0 -16px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.gbanner span:nth-child(2){z-index:2;height:112%}
.gbanner b{position:absolute;left:10px;top:8px;color:#ffe27a;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000;z-index:3}
.gbanner b+b{left:auto;right:10px}
.zk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.zk button{position:relative;border:2px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#fff,#efe2c8);padding:0;aspect-ratio:160/215;overflow:hidden;cursor:pointer}
.zk button.r2{border-color:#9ab8e8}.zk button.r3{border-color:#e8b830;background:linear-gradient(180deg,#fff8dc,#ffd8e4)}
.zk button .zp{position:absolute;inset:0 0 18px 0}
.zk button span.nm{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:900;background:rgba(43,38,34,.82);color:#fff;padding:2px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zk button em{position:absolute;left:3px;top:2px;font-style:normal;font-size:9px;font-weight:900;color:#a97c22;text-shadow:0 0 3px #fff}
.zk button i{position:absolute;right:3px;top:2px;font-style:normal;font-size:10px;font-weight:900;background:var(--shu);color:#fff;border-radius:6px;padding:0 4px}
.cdet{display:flex;gap:10px;align-items:flex-end}
.cdet .cd-pt{width:42%;flex:none;aspect-ratio:160/200;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#fff,#efe2c8)}
.cdet .cd-main{flex:1;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.stars{color:#d8a020;font-size:14px;letter-spacing:.05em;font-weight:900}
.quote{font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1.7;background:var(--paper);border-radius:10px;padding:8px 10px}
.evart{height:150px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 70%,#6a2a2a,#1a0a10);display:flex;justify-content:center;align-items:flex-end}
.evart>*{height:116%;aspect-ratio:200/240}
.evart.ic{background:linear-gradient(180deg,#f4e4c4,#d8c098);align-items:center}
.evart.ic>svg{height:100%;width:100%;aspect-ratio:auto}
.party,.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist{max-height:190px;overflow-y:auto;padding:2px}
.pc{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:2px 9px 2px 2px;font-size:11.5px;font-weight:900;cursor:pointer}
.pc .fi{width:28px;height:28px}
.pc i{font-style:normal;color:var(--shu);font-variant-numeric:tabular-nums}
.pc s{text-decoration:none;color:#c8981a;font-size:10px}
.pc.on{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}
.pc.on i{color:#ffd27a}
.pc.secp{background:linear-gradient(90deg,#ffe4ec,#fff);border-color:#e0406a;cursor:default}
.lb{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.lb div{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/1.35;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:9.5px;font-weight:900;text-align:center;line-height:1.2;padding:2px}
.lb div b{font-size:11px;color:var(--ink-soft)}
.lb div.got{background:#f6e6d6}
.lb div.got::after{content:"済";position:absolute;inset:18% 12%;border:2.5px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--font-display);font-size:18px;display:grid;place-items:center;transform:rotate(-12deg);opacity:.85}
.lb div.today{border-color:var(--shu);box-shadow:0 0 0 2px rgba(178,60,42,.25)}
.lb div.today::after{animation:stampIn .5s .2s cubic-bezier(.2,1.6,.4,1) both}
.trib{display:flex;flex-direction:column;gap:8px}
.trib .tr{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.trib .tr.top{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.trib .tr-h{display:flex;align-items:center;gap:8px}
.trib .tr-h b{flex:1;font-size:13.5px}
.trib .tr-h em{font-style:normal;font-size:11px;font-weight:900;color:#fff;background:var(--gold);border-radius:99px;padding:1px 8px}
.trib .tr .acts .btn{padding:7px 8px;font-size:12px;min-width:0}
.trib .tr.lock{opacity:.55}
.memo{display:flex;flex-direction:column;gap:8px}
.memo .mr{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 10px}
.memo .mr .fi{width:46px;height:46px}
.memo .mr .mm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.memo .eps{display:flex;flex-wrap:wrap;gap:4px}
.memo .eps button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 8px;font-size:10.5px;font-weight:900;cursor:pointer}
.memo .eps span{border:1px dashed var(--line);border-radius:99px;padding:3px 8px;font-size:10.5px;font-weight:900;color:#b8a88a}
.endst{font-family:var(--font-display);font-weight:800;color:var(--shu);font-size:12px}
.endcard{position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,var(--hb),#fff);height:300px;display:flex;justify-content:center;align-items:flex-end}
.endcard>div{height:112%;aspect-ratio:200/240}
.endcard b{position:absolute;left:12px;top:10px;font-family:var(--font-display);font-size:40px;font-weight:800;color:var(--shu);text-shadow:0 2px 0 #fff}

/* gacha overlay */
.gc{position:fixed;inset:0;z-index:40;overflow:hidden;background:radial-gradient(circle at 50% 38%,#4a3058,#160c1c 75%);color:#fff;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.gc-gate{position:absolute;inset:9% 7%;display:flex;perspective:900px;z-index:2}
.gc-door{flex:1;position:relative;background:repeating-linear-gradient(90deg,#6a4426 0 18px,#7e5430 18px 36px);border:5px solid #3a2414;box-shadow:inset 0 0 30px rgba(0,0,0,.5);transition:transform 1s cubic-bezier(.6,0,.25,1)}
.gc-door.l{transform-origin:left center;border-right-width:2px}
.gc-door.r{transform-origin:right center;border-left-width:2px}
.gc-door i{position:absolute;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;border:4px solid #d8b050;background:radial-gradient(circle,#c99a2a 0 20%,transparent 22%),#3a2414}
.gc-door.l i{right:-34px}.gc-door.r i{left:-34px;display:none}
.gc-door::before{content:"";position:absolute;left:0;right:0;top:22%;height:10px;background:#3a2414;box-shadow:0 calc(56vh * .7) 0 #3a2414}
.gc.open .gc-door.l{transform:rotateY(82deg)}
.gc.open .gc-door.r{transform:rotateY(-82deg)}
.gc .gc-gate::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:var(--rc);box-shadow:0 0 18px 6px var(--rc);animation:leak 1s ease-in-out infinite alternate}
.gc.open .gc-gate::after{display:none}
.gc.open .gc-gate{pointer-events:none}
.gc.r1{--rc:#fff4d8}.gc.r2{--rc:#8ab8ff}.gc.r3{--rc:#ffd34a}
.gc-light{position:absolute;inset:-20%;background:radial-gradient(circle,var(--rc) 0%,transparent 55%);opacity:0;z-index:1}
.gc.open .gc-light{animation:burst 1.2s ease-out both}
.gc.r3.open .gc-light{background:conic-gradient(from 0deg,#ffd34a,#ff8ab8,#8ad0ff,#b8ff8a,#ffd34a);mask:radial-gradient(circle,#000 0 20%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0 20%,transparent 60%);animation:burst 1.4s ease-out both,spin 4s linear infinite}
.gc-stage{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:0 12px}
.gc-hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;font-weight:900;opacity:.6;z-index:3;letter-spacing:.2em}
.gc-skip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:4;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.3);color:#fff;border-radius:99px;padding:6px 14px;font-weight:900;font-size:12px;cursor:pointer}
.gcard{position:relative;width:min(76vw,300px);aspect-ratio:3/4.3;border-radius:18px;overflow:hidden;border:3px solid var(--rc);background:var(--rb);box-shadow:0 0 30px var(--rc);animation:cardIn .55s cubic-bezier(.2,1.4,.4,1) both;color:var(--ink)}
.gcard.r1{--rc:#e8dcc0;--rb:linear-gradient(170deg,#fffaf0,#e8d8b4)}
.gcard.r2{--rc:#8ab8ff;--rb:linear-gradient(170deg,#f4f8ff,#b8cff0)}
.gcard.r3{--rc:#ffcf3a;--rb:linear-gradient(170deg,#fff6d0,#ffc8dc 55%,#c8e4ff)}
.gcard.r3::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);background-size:250% 100%;animation:shimmer 2.2s linear infinite;pointer-events:none}
.gcard .gp{position:absolute;left:0;right:0;top:6%;bottom:30%}
.gcard .gi{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 10px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.92) 26%);display:flex;flex-direction:column;gap:2px}
.gcard .gi b{font-family:var(--font-display);font-size:20px;font-weight:800}
.gcard .gi small{font-size:11px;font-weight:900;color:var(--ink-soft)}
.gcard .gi q{quotes:"「" "」";font-size:12px;font-weight:700;line-height:1.5}
.gcard .gs{position:absolute;left:10px;top:8px;font-size:20px;color:#e0a810;text-shadow:0 1px 0 #fff,0 0 6px #fff;font-weight:900;letter-spacing:.04em}
.gcard .gt{position:absolute;right:10px;top:10px;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:99px;padding:2px 9px}
.gcard .gn{position:absolute;right:10px;top:34px;font-size:12px;font-weight:900;background:var(--shu);color:#fff;border-radius:6px;padding:1px 7px;animation:pop .4s .3s both}
.gc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(96vw,470px)}
.gc-grid .gcard{width:auto;border-width:2px;border-radius:10px;animation-duration:.4s}
.gc-grid .gcard .gp{top:14%;bottom:24%}
.gc-grid .gcard .gi{padding:3px 4px 4px;background:rgba(255,255,255,.9)}
.gc-grid .gcard .gi b{font-family:var(--font-body);font-size:9.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-grid .gcard .gi small,.gc-grid .gcard .gi q,.gc-grid .gcard .gt{display:none}
.gc-grid .gcard .gs{font-size:10px;left:4px;top:3px}
.gc-grid .gcard .gn{font-size:9px;right:3px;top:3px;padding:0 4px}
.gc-ok{min-width:200px}

/* battle overlay */
.bt{position:fixed;inset:0;z-index:40;overflow:hidden;background:linear-gradient(170deg,#24142a 0%,#6a2a2a 58%,#1a0e10 100%);color:#fff;cursor:pointer;touch-action:manipulation}
.bt.dis{background:linear-gradient(170deg,#3a2614 0%,#8a5a2a 58%,#2a1a0e 100%)}
.bt .speed{position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,255,255,.05) 22px 24px);animation:speed .5s linear infinite}
.bt-side{position:absolute;top:8%;bottom:30%;width:58%;display:flex;align-items:flex-end;justify-content:center}
.bt-side.l{left:-6%;animation:dashL .5s cubic-bezier(.2,1,.3,1) both}
.bt-side.r{right:-6%;animation:dashR .5s cubic-bezier(.2,1,.3,1) both}
.bt-main{height:100%;aspect-ratio:200/240;max-width:100%}
.bt-side.r .bt-main .pt{transform:scaleX(-1)}
.bt-side.r.ic .bt-main{aspect-ratio:200/160;height:auto;width:100%;margin-bottom:20%}
.bt-side.r.ic .bt-main svg{transform:none}
.bt-subs{position:absolute;left:8%;bottom:-6%;display:flex;gap:4px}
.bt-subs .fi{width:44px;height:44px;animation:pop .4s .4s both}
.bt-vs{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:64px;font-weight:800;color:#ffd34a;-webkit-text-stroke:2px #6a1a1a;paint-order:stroke;text-shadow:0 0 20px rgba(255,200,60,.6);animation:stamp .45s .45s cubic-bezier(.2,1.6,.4,1) both;z-index:4}
.bt-hud{position:absolute;left:12px;right:12px;bottom:calc(16% + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:14px;z-index:5}
.bt-hud b{display:block;font-size:12.5px;font-weight:900;margin-bottom:3px;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-hud>div:last-child{text-align:right}
.hp{height:12px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;border:1.5px solid rgba(255,255,255,.7);display:flex}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#4ac060,#c8f060);transition:width .35s}
.hp.r{justify-content:flex-end}
.hp.r i{background:linear-gradient(90deg,#f0a060,#e04848)}
.bt-res{position:absolute;left:0;right:0;top:42%;z-index:9;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 16px}
.bt-res b{font-family:var(--font-display);font-size:68px;font-weight:800;line-height:1;color:#ffd34a;-webkit-text-stroke:3px #6a1a1a;paint-order:stroke;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.bt-res.lose b{color:#b8c0d0;-webkit-text-stroke-color:#2a2a3a}
.bt-res p{background:rgba(0,0,0,.55);border-radius:12px;padding:8px 14px;font-weight:700;font-size:13.5px;line-height:1.6;max-width:420px;animation:fadeIn .4s .3s both}
.bt-res small{opacity:.7;font-weight:900;font-size:11px;animation:blink 1.6s infinite}
.bt.shake,.op.shake{animation:shake .3s}

@keyframes whit{0%{opacity:.9}100%{opacity:0}}
@keyframes kanji{0%{opacity:0;transform:scale(2.2) rotate(-8deg)}25%{opacity:1;transform:scale(1) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) rotate(-8deg)}}
@keyframes zoomOut{0%{transform:scale(3.4)}100%{transform:scale(1)}}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-60px,110vh) rotate(720deg)}}
@keyframes kite{0%{transform:translate(0,0)}25%{transform:translate(35vw,3vh)}50%{transform:translate(70vw,-1vh)}75%{transform:translate(100vw,4vh)}100%{transform:translate(135vw,0)}}
@keyframes charIn{0%{opacity:0;transform:translateY(24px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bubIn{0%{opacity:0;transform:translateY(8px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes heartUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes lvfx{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
@keyframes leak{0%{opacity:.5}100%{opacity:1}}
@keyframes burst{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:.55;transform:scale(1.2)}}
@keyframes spin{100%{rotate:360deg}}
@keyframes cardIn{0%{opacity:0;transform:rotateY(90deg) scale(.7)}100%{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:150% 0}100%{background-position:-100% 0}}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.bt-res b{animation-name:stampB}
@keyframes stampB{0%{opacity:0;transform:scale(2.4)}100%{opacity:1;transform:none}}
@keyframes stampIn{0%{opacity:0;transform:rotate(-12deg) scale(2)}100%{opacity:.85;transform:rotate(-12deg) scale(1)}}

<body>

<div id="boot" class="boot" role="button" tabindex="0" aria-label="はじめる"><div class="boot-in"><b>だいずソフト</b><p>画面をタップしてください</p><small>音が出ます</small></div></div>
<div id="op" class="op" hidden aria-label="オープニング"></div>
<section id="title" aria-label="タイトル" hidden>
  <div class="ti-bg" id="tiBg"></div>
  <div class="ti-sky" id="tiSky"></div>
  <div class="ti-heroes" id="tiHeroes"></div>
  <div class="ti-main">
    <h1 class="ti-logo" id="tiLogo">恋普請</h1>
    <div class="ti-panel">
      <div class="t-actions">

      <p class="t-note">&copy; だいずソフト　街づくり × 恋愛シミュレーション</p>

</section>

  <header class="top gut">

      <div class="stats">

        <div class="stat"><i>人</i><b id="sPop">0</b></div>

<script>
'use strict';
document.documentElement.lang = 'ja';
const $ = (id) => document.getElementById(id);

/* ======================= constants & data ======================= */
const W = 32, H = 32, N = W * H, TS = 28;
const HOUR_SEC = 2.5, WALK = 8, CARRY = 6, BUILD_RATE = 1.2, OUT_CAP = 24, IN_TARGET = 12, EAT = 0.4;
const GATE = 20 * W + 0;
const CASTLE = { x: 16, y: 9, w: 4, h: 4 };
const SAVE_KEY = 'jokamachi:save:v1', SET_KEY = 'jokamachi:settings:v1';
const SEASONS = ['春', '夏', '秋', '冬'];
const KOKU = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (n) => Math.floor(n + 1e-9).toLocaleString('ja-JP');
const g0 = (o, k) => o[k] || 0;
const addTo = (o, k, v) => { o[k] = (o[k] || 0) + v; };
const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

const GOODS = {
  log: { name: '原木', col: '#7a5230' }, wood: { name: '材木', col: '#c9965c' }, stone: { name: '石', col: '#8d8b86' },
  rice: { name: '米', col: '#f2ead2' }, fish: { name: '魚', col: '#5f8fb3' }, clay: { name: '粘土', col: '#b36b3a' },
  tile: { name: '瓦', col: '#4c5563' }, sake: { name: '酒', col: '#d8b75a' },
};
const GK = Object.keys(GOODS);
const PRICE = { log: 2, wood: 4, stone: 3, rice: 3, fish: 3, clay: 2, tile: 8, sake: 10 };
const ROOF = {
  kaya: ['#c4a565', '#8c7341'], ita: ['#9a7552', '#694e35'], kawara: ['#5f6877', '#434a56'], kura: ['#f3eee2', '#3f4651'],
  kiln: ['#7d6b5b', '#4f4339'], shrine: ['#b23c2a', '#7e2a1e'], temple: ['#565e6b', '#3a404a'], market: ['#d9c9a3', '#b23c2a'],
  field: ['#a9c47a', '#7f9a55'], yard: ['#cdb790', '#8f7a58'],
};
const DEF = {

/* --- sheet events --- */
$('sheet').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  sfx.tap();
  const act = t.dataset.act;
  if (act === 'close') { closeSheet(); return; }
  if (act === 'replay') { const ch = CHAPTERS[S.chapter]; closeSheet(); playStory([...ch.intro], () => openGoals()); return; }
  if (act === 'help') { openHelp(); return; }
  if (act === 'sound') { SET.sound = !SET.sound; saveSet(); t.textContent = `効果音：${SET.sound ? 'オン' : 'オフ'}`; return; }
  if (act === 'save') { save(); toast('保存した'); return; }
  if (act === 'title') { save(); closeSheet(); toTitle(); return; }
  if (act === 'castle') { startCastleStage(); closeSheet(); return; }
  if (act === 'demolish') {
    const b = B(selected); if (!b) return;
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'もう一度押すと取りこわす'; return; }
    closeSheet(); demolish(b); return;
  }
  if (t.dataset.cat) { buildCat = t.dataset.cat; openBuildMenu(); return; }
  if (t.dataset.build) { const k = t.dataset.build; if (S.chapter < DEF[k].unlock) { toast('物語を進めると建てられます'); return; } startBuild(k); return; }
  const b = B(selected);
  if (b && t.dataset.prio !== undefined) { b.prio = Number(t.dataset.prio); b.stopped = false; assignJobs(true); save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.stop) { b.stopped = !b.stopped; assignJobs(false); save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.allow) { b.allow[t.dataset.allow] = !b.allow[t.dataset.allow]; save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.tmode) { const [g, m] = t.dataset.tmode.split(':'); const o = b.orders[g] || { mode: 'none', n: g === 'rice' ? 60 : 20 }; o.mode = m; b.orders[g] = o; save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.tstep) { const [g, s] = t.dataset.tstep.split(':'); const o = b.orders[g]; if (!o) return; o.n = clamp(o.n + (s === '+' ? 5 : -5), 0, 500); save(); sheetFn && sheetFn(); return; }
});

const surf = V3 ? $('gl') : cv;
const ptrs = new Map(); let pinch = null, dragMoved = false;
surf.addEventListener('pointerdown', (e) => {
  sfx.unlock(); try { surf.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, btn: e.button });
  if (ptrs.size === 1) dragMoved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; dragMoved = true; }
});
surf.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    if (Math.hypot(p.x - p.x0, p.y - p.y0) > 8) dragMoved = true;
    if (dragMoved) { if (p.btn === 2) VIEW.rotate(-dx * 0.008); else VIEW.pan(dx, dy); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], r = surf.getBoundingClientRect();

function opClear() { for (const el of [...$('op').querySelectorAll('.op-sc:not(.out)')]) { el.classList.add('out'); setTimeout(() => el.remove(), 480); } }
function opFx(sc, h, ms) { const L = sc.querySelector('.fxl'); if (!L) return; const d = document.createElement('div'); d.innerHTML = h; const n = d.firstChild; L.appendChild(n); setTimeout(() => n.remove(), ms); }
function opHit(sc, k, kj, x, y) { opFx(sc, `<div class="slash ${k % 2 ? 'b' : ''}"></div>`, 420); opFx(sc, '<div class="whit"></div>', 380); opFx(sc, `<div class="kanji" style="left:${x}%;top:${y}%">${kj}</div>`, 720); const o = $('op'); o.classList.remove('shake'); void o.offsetWidth; o.classList.add('shake'); sfx.slash(); sfx.hit(0.05); }
function playOpening() {
  OP.on = true; OP.t0 = performance.now(); const op = $('op'); op.hidden = false; op.className = 'op';
  op.innerHTML = '<div class="op-flash"></div><div class="op-skip">タップでスキップ</div>'; sfx.flash();
  opAt(650, () => { opScene('op-logo-sc', `<div class="op-bean">${beanSvg()}</div><div class="op-logo">${[...'だいずソフト'].map((c, i) => `<span style="animation-delay:${1.25 + i * 0.08}s">${c}</span>`).join('')}</div><div class="op-en">DAIZU SOFT</div>`); sfx.roll(); });
  opAt(1900, () => sfx.chime());
  opAt(4300, opClear);
  opAt(4700, () => { opScene('op-title-sc', petalsHtml() + logoHtml()); sfx.taiko(); });
  opAt(7300, opClear);
  HK.forEach((k, i) => opAt(7700 + i * 1450, () => { opClear(); const H = HEROINES[k]; opScene('op-hero', `<div class="band" style="--hc:${H.col};--hb:${H.bg}"></div><div class="op-pt ${i % 2 ? 'lft' : ''}">${portrait(H.sp, i === 3 ? 'normal' : 'happy')}</div><div class="cap ${i % 2 ? 'rt' : ''}" style="--hc:${H.col}"><small>${H.kind}</small><b>${H.name}</b><i>${H.yomi}</i><q>${H.catch}</q></div>`); sfx.koto(i); }));
  opAt(13500, () => { opClear(); opScene('op-trio', `<div class="row"><div class="tp">${portrait(NPC.lord.sp, 'happy')}<span>殿・青葉守</span></div><div class="tp big">${portrait(NPC.me.sp, 'normal')}<span>主人公・若き領主</span></div><div class="tp">${portrait(NPC.mikado.sp, 'normal')}<span>帝</span></div></div><div class="op-cap">ひょんなことから、領地を賜った一人の侍</div>`); sfx.koto(5); });
  opAt(15200, () => { opClear(); opScene('op-people', `<div class="grid">${['omitsu', 'gonta', 'tasuke', 'tago', 'tatsu', 'matabee', 'echigoya', 'shizuka'].map((id, i) => `<div class="pp" style="animation-delay:${i * 0.07}s">${portrait(CHAR[id].sp, 'happy', { vb: VB_BUST })}<span>${CHAR[id].name.split(' ')[0]}</span></div>`).join('')}</div><div class="op-cap">町に集う、個性ゆたかな人々</div>`); sfx.koto(6); });
  opAt(16900, () => { opClear(); $('op').classList.add('dark'); opScene('op-dark', `<div class="dk dk-l">${portrait(NPC.yami.sp, 'angry')}</div><div class="dk dk-r">${portrait(NPC.yami.sp, 'angry')}</div><div class="dk dk-c">${portrait(NPC.genba.sp, 'normal')}</div><div class="dk dk-bl">${portrait(NPC.sanzoku.sp, 'angry')}</div><div class="dk dk-br">${portrait(NPC.zoku.sp, 'normal')}</div><div class="op-cap lt">泰平をおびやかす、闇の影</div>`); sfx.drone(); });
  opAt(19000, () => {
    opClear();
    const sc = opScene('op-battle', `<div class="speed"></div><div class="ob l p1">${portrait(HEROINES.kaede.sp, 'angry')}</div><div class="ob r p1">${portrait(NPC.yami.sp, 'angry')}</div><div class="ob l p2">${portrait(HEROINES.koharu.sp, 'angry')}</div><div class="ob r p2">${portrait(NPC.sanzoku.sp, 'angry')}</div><div class="fxl"></div><div class="op-cap lt">守りたいものが、ここにある</div>`);
    sfx.taiko();
    opAt(450, () => opHit(sc, 0, '斬', 50, 20)); opAt(900, () => opHit(sc, 1, '閃', 10, 34));
    opAt(1300, () => sc.classList.add('ph2')); opAt(1650, () => opHit(sc, 0, '破', 46, 24)); opAt(2000, () => opHit(sc, 1, '撃', 12, 36));
  });
  opAt(21500, () => { opClear(); $('op').classList.remove('dark'); opScene('op-town', `<div class="pano">${panoSvg()}</div>${petalsHtml(10)}<div class="op-cap">荒れ地から始まる、恋と普請の物語</div>`); sfx.wind(); });
  opAt(24300, () => { opScene('op-final', logoHtml()); sfx.taiko(); sfx.chime(); });
  opAt(27000, endOpening);
}
function endOpening() {
  if (!OP.on) return; OP.on = false; OP.timers.forEach(clearTimeout); OP.timers = [];
  const op = $('op'); op.hidden = true; op.innerHTML = ''; KP.op = 1; saveKP(); showTitleScreen();
}
$('op').addEventListener('pointerdown', () => { if (performance.now() - OP.t0 > 500) endOpening(); });
function showTitleScreen() {
  const ti = $('title'); ti.hidden = false;
  $('tiBg').innerHTML = panoSvg(); $('tiLogo').innerHTML = logoHtml();
  $('tiHeroes').innerHTML = HK.map((k, i) => `<div class="tih h${i}">${portrait(HEROINES[k].sp, i === 3 ? 'normal' : 'happy')}</div>`).join('');
  $('tiSky').innerHTML = petalsHtml(12) + `<div class="ti-kite">${kiteSvg}</div>`;
  renderTitle();
  setTimeout(() => { if (!ti.hidden) { sfx.kite(); sfx.kite(0.95, 0.07); } }, 900);
}
function enterGame(start) {
  const c = $('clouds'); c.hidden = false; c.className = 'clouds pre'; void c.offsetWidth; c.className = 'clouds'; sfx.wind();
  setTimeout(() => {
    if (!start()) { c.className = 'clouds open'; setTimeout(() => { c.hidden = true; }, 1800); return; }
    $('title').hidden = true;
    setTimeout(() => { c.className = 'clouds open'; sfx.kite(); sfx.kite(1.0, 0.07); setTimeout(() => { c.hidden = true; c.className = 'clouds'; afterEnter(); }, 1850); }, 300);
  }, 650);
}
function afterEnter() {
  renderSec(true); loginChecked = false;
  if (!S.koi.pro) { startPrologue(); return; }
  secSay(SAY[S.koi.sec].login, 4000);
}
function bootGo() {
  if ($('boot').hidden) return; sfx.unlock(); $('boot').hidden = true; playOpening();
}
$('boot').addEventListener('click', bootGo);
$('boot').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') bootGo(); });
$('opBtn').addEventListener('click', () => { sfx.unlock(); $('title').hidden = true; playOpening(); });
$('memBtn').addEventListener('click', () => { sfx.unlock(); openMemories(true); });

/* ======================= loop & screens ======================= */
function frame(t) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;
  const running = !paused && !(sheetPause && !$('sheetWrap').hidden) && $('title').hidden && !ovOpen() && !OP.on;
  if (running && S) {
    let dtH = dt / HOUR_SEC * SET.speed;
    while (dtH > 0) { const st = Math.min(dtH, 0.05); tick(st); dtH -= st; }
  }
  if (V3) V3.render(t, dt); else draw(t);
  if (S && t - (frame.lastUi || 0) > 250) { frame.lastUi = t; renderTop(); if (mode) updatePlacebar(); if (t - (frame.lastCh || 0) > 1000) { frame.lastCh = t; checkChapter(); koiTick(); }
    if (running && t - (frame.lastSec || 0) > 42000) { frame.lastSec = t; if (!uiBusy() && !mode && S.koi.pro) secSay(secAdvice()); } }
}
function showGame() {
  $('title').hidden = true; $('game').hidden = false;
  requestAnimationFrame(() => { resize(); terrainDirty = true; });
  if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); }
}
function toTitle() {
  exitMode(); cancelAnimationFrame(rafId); rafId = 0;
  $('game').hidden = true; $('secBub').hidden = true; showTitleScreen();
}
function renderTitle() {
  const d = store.get(SAVE_KEY, null);
  const cb = $('contBtn'), nb = $('newBtn');
  if (d && d.t !== undefined) { const day = Math.floor(d.t / 24); cb.hidden = false; cb.innerHTML = `<span>つづきから</span><small>${Math.floor(day / 20) + 1}年目 ${SEASONS[Math.floor((day % 20) / 5)]} ・ 人口${(d.c || []).length}人</small>`; nb.className = 'btn'; }
  else { cb.hidden = true; nb.className = 'btn btn-shu'; }
  nb.textContent = '新しく始める'; delete nb.dataset.armed;
}
$('contBtn').addEventListener('click', () => { sfx.unlock(); enterGame(() => { if (!load()) { renderTitle(); return false; } showGame(); return true; }); });
$('newBtn').addEventListener('click', () => {
  sfx.unlock(); const nb = $('newBtn');
  if (store.get(SAVE_KEY, null) && !nb.dataset.armed) { nb.dataset.armed = '1'; nb.textContent = 'もう一度押すと新しく始めます（今の町は消えます）'; return; }
  enterGame(() => { newGame(); save(); showGame(); return true; });
});
window.addEventListener('resize', () => { if (!$('game').hidden) resize(); });
if ('ResizeObserver' in window) new ResizeObserver(() => { if (!$('game').hidden) resize(); }).observe(stageEl);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !$('game').hidden) save(); });
window.addEventListener('pagehide', () => { if (S && !$('game').hidden) save(); });
if (document.fonts && document.fonts.load) document.fonts.load('800 14px "Shippori Mincho B1"').then(() => { if (V3) V3.resetLabels(); }).catch(() => {});
$('rotBtns').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !V3) return; sfx.tap(); V3.rotateStep(Number(b.dataset.rot)); });
$('clL').innerHTML = cloudSvg(1, false); $('clR').innerHTML = cloudSvg(2, true);
renderTitle();
</script>
</body>
