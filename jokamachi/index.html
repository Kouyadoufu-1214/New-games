<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>城下町普請帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="江戸時代、川沿いの荒れ地に城下町を築く。道を引き、荷を運ばせ、人を働かせる街づくりシミュレーション">
<meta name="theme-color" content="#efe6d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="普請帖">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: an Edo-period town map (城下絵図) fills the screen; a slim almanac bar sits on top and an order bar
     (道・建てる・撤去・帳簿) docks at the bottom. One paper-and-ink world by design. */
  color-scheme:light;
  --paper:#efe6d2; --paper-2:#e4d7ba; --paper-3:#f8f2e4; --ink:#2b2622; --ink-soft:#6c6257; --line:#cbbb98;
  --shu:#b23c2a; --shu-deep:#842a1c; --ai:#2f4f6f; --matcha:#58733a; --gold:#a97c22;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
html{box-sizing:border-box;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);overscroll-behavior:none}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;touch-action:manipulation;font-weight:900;font-size:14px;line-height:1.3;
  background:var(--paper-3);color:var(--ink);box-shadow:0 3px 0 #cdbd99;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 #cdbd99}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{font-size:11px;font-weight:700;opacity:.8}
.btn-shu{background:var(--shu);border-color:var(--shu-deep);color:#fbf4e6;box-shadow:0 3px 0 var(--shu-deep)}
.btn-shu:active:not([disabled]){box-shadow:0 1px 0 var(--shu-deep)}
.btn-ai{background:var(--ai);border-color:#1f3650;color:#f3eee2;box-shadow:0 3px 0 #1f3650}
.btn:focus-visible,.tool:focus-visible,.seg button:focus-visible,.card:focus-visible{outline:3px solid var(--ai);outline-offset:2px}

/* title */
#title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-block:24px;
  background:radial-gradient(ellipse at 50% 40%,#f7f0e0 0%,var(--paper) 60%,#e2d4b4 100%)}
.t-seal{width:62px;height:62px;border:3px solid var(--shu);border-radius:8px;color:var(--shu);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.05;transform:rotate(-4deg);padding:4px}
.t-name{font-family:var(--font-display);font-weight:800;font-size:44px;letter-spacing:.12em;line-height:1.15;writing-mode:horizontal-tb}
.t-sub{font-family:var(--font-display);font-weight:600;color:var(--ink-soft);font-size:14px;line-height:2}
.t-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.t-actions .btn{padding:14px;font-size:16px}
.t-note{font-size:12px;color:var(--ink-soft)}

/* game frame */
#game{height:100%;display:flex;flex-direction:column}
.top{background:linear-gradient(180deg,#f6efde,#ece2c9);border-bottom:1px solid var(--line);padding-block:6px 6px;display:flex;flex-direction:column;gap:6px;z-index:2}
.top-row{display:flex;align-items:center;gap:8px}
.date{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}
.date b{font-family:var(--font-display);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date span{font-size:11.5px;color:var(--ink-soft);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){.date b{font-size:14px}.stat{min-width:38px;padding:3px 4px}.stat b{font-size:12.5px}}
.stats{display:flex;gap:5px;margin-left:auto}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1.1;background:var(--paper-3);border:1px solid var(--line);border-radius:10px;padding:3px 6px;min-width:42px}
.stat i{font-style:normal;font-size:10px;color:var(--ink-soft);font-weight:700}
.stat b{font-size:13.5px;font-variant-numeric:tabular-nums;font-weight:900}
.stat b.bad{color:var(--shu)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper-3)}
.seg button{border:0;background:none;padding:7px 6px;font-size:11px;font-weight:900;cursor:pointer;min-width:28px;touch-action:manipulation;letter-spacing:-.1em}
.seg button.on{background:var(--ink);color:var(--paper-3)}
.goal{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper-3);border:1px solid var(--line);border-left:4px solid var(--shu);border-radius:10px;padding:5px 10px;cursor:pointer;text-align:left;width:100%}
.goal .g-ch{font-family:var(--font-display);font-weight:800;font-size:12.5px;white-space:nowrap}
.goal .g-t{font-size:12.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .g-n{font-size:12px;font-weight:900;color:var(--shu);white-space:nowrap}
.stage{flex:1;min-height:0;position:relative;touch-action:none;background:#d8cba9;overflow:hidden}
#cv,#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.rot{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px}
.rot button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(248,242,228,.92);font-size:19px;font-weight:900;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 #cdbd99;display:grid;place-items:center;padding:0}
.rot button:active{transform:translateY(1px)}
.placebar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding-block:8px;background:rgba(248,242,228,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.placebar .pb-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.placebar .pb-t b{font-size:14px}
.placebar .pb-t span{font-size:12px;color:var(--ink-soft);font-weight:700}
.placebar .pb-t span.bad{color:var(--shu)}
.placebar .btn{padding:9px 14px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:6px 6px;background:linear-gradient(180deg,#ece2c9,#e6d9bc);border-top:1px solid var(--line);z-index:2}
.tool{border:1px solid var(--line);background:var(--paper-3);border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;touch-action:manipulation;font-weight:900;font-size:11.5px}
.tool svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}
.tool.on svg{stroke:var(--paper-3)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-140%);z-index:6;background:var(--ink);color:var(--paper-3);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:99px;
  width:max-content;max-width:calc(100% - 120px);text-align:center;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(43,38,34,.22);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:calc(40px + env(safe-area-inset-top,0px))}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--paper-3);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(43,38,34,.2);animation:rise .28s cubic-bezier(.2,1.2,.4,1) both;
  background-image:repeating-linear-gradient(0deg,rgba(150,120,70,.035) 0 1px,transparent 1px 4px)}
.sheet.short{max-height:62%}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-icon{width:42px;height:42px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;color:#fbf4e6;border:1px solid rgba(0,0,0,.25)}
.sh-title{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.25}
.sh-kick{font-size:11.5px;font-weight:900;color:var(--shu);letter-spacing:.06em}
.sh-x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:18px;line-height:1;flex:none}
.status{font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#e8efd9;color:#3e5523}
.status.warn{background:#f6e0d6;color:var(--shu-deep)}
.desc{font-size:13px;color:var(--ink-soft);line-height:1.6}
.rows{display:flex;flex-direction:column;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.rows span{color:var(--ink-soft);font-weight:700}
.rows b{font-variant-numeric:tabular-nums;text-align:right}
.rows .sub{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.bar{height:7px;border-radius:99px;background:#e1d5b8;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:inherit}
.prow{display:flex;align-items:center;gap:8px;font-size:12.5px}
.prow span{min-width:44px;font-weight:700}
.prow b{min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.sec{font-family:var(--font-display);font-weight:800;font-size:14px;margin-top:2px}
.segrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.segrow .seg button{padding:7px 10px;font-size:12.5px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-weight:900;font-size:12.5px;cursor:pointer}
.cats button.on{background:var(--ink);color:var(--paper-3);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:7px}
.card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.card .c-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.card .c-main b{font-size:14px}
.card .c-main span{font-size:11.5px;color:var(--ink-soft)}
.card .c-cost{font-size:11.5px;font-weight:900;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.card.locked{opacity:.5}
.trade{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.trow .seg button{padding:6px 8px;font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper-3);font-weight:900;cursor:pointer}
.step b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.talk{display:flex;gap:12px;align-items:flex-start}
.face{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:24px;border:2px solid var(--ink);background:var(--paper)}
.talk .who{font-size:12px;font-weight:900;color:var(--ink-soft)}
.talk p{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.8}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:700;line-height:1.45}
.goals li i{font-style:normal;width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-size:12px;margin-top:1px}
.goals li.ok{color:var(--ink-soft)}
.goals li.ok i{background:var(--matcha);border-color:var(--matcha);color:#fff}
.note{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;line-height:1.6}

@keyframes rise{0%{transform:translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section id="title" class="gut" aria-label="タイトル">
  <div class="t-seal" aria-hidden="true">普請<br>之帖</div>
  <h1 class="t-name">城下町普請帖</h1>
  <p class="t-sub">戦の世が終わり、殿は川のほとりに城を築くと決めた。<br>普請奉行となって、荒れ地に城下町を開け。</p>
  <div class="t-actions">
    <button class="btn btn-shu" id="contBtn" type="button" hidden></button>
    <button class="btn" id="newBtn" type="button">新しく始める</button>
  </div>
  <p class="t-note">道を引き、荷を運ばせ、人を働かせる街づくり</p>
</section>

<section id="game" aria-label="城下町" hidden>
  <header class="top gut">
    <div class="top-row">
      <div class="date"><b id="dDate"></b><span id="dTime"></span></div>
      <div class="stats">
        <div class="stat"><i>両</i><b id="sMoney">0</b></div>
        <div class="stat"><i>人</i><b id="sPop">0</b></div>
        <div class="stat"><i>満足</i><b id="sHappy">0</b></div>
        <div class="stat"><i>食</i><b id="sFood">0</b></div>
      </div>
    </div>
    <div class="top-row">
      <button class="goal" id="goalBtn" type="button"><span class="g-ch" id="gCh"></span><span class="g-t" id="gT"></span><span class="g-n" id="gN"></span></button>
      <div class="seg" id="speed" role="group" aria-label="時の速さ">
        <button type="button" data-s="0" aria-label="止める">❚❚</button><button type="button" data-s="1" aria-label="ふつう">▶</button><button type="button" data-s="3" aria-label="はやい">▶▶</button><button type="button" data-s="6" aria-label="とてもはやい">▶▶▶</button>
      </div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="城下の地図"></canvas>
    <canvas id="gl" aria-label="城下の地図（クォータービュー）" hidden></canvas>
    <div class="rot" id="rotBtns" hidden><button type="button" data-rot="1" aria-label="左に回す">⟲</button><button type="button" data-rot="-1" aria-label="右に回す">⟳</button></div>
    <div class="placebar gut" id="placebar" hidden>
      <div class="pb-t"><b id="pbT"></b><span id="pbS"></span></div>
      <button class="btn btn-shu" id="pbOk" type="button">決定</button>
      <button class="btn" id="pbNo" type="button">やめる</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <nav class="tools gut" aria-label="指示">
    <button class="tool" id="tRoad" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L5 21M16 3l3 18M12 4v3M12 10v4M12 17v3"/></svg>道</button>
    <button class="tool" id="tBuild" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11L12 4l9 7M5 10v10h14V10M10 20v-6h4v6"/></svg>建てる</button>
    <button class="tool" id="tRemove" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>撤去</button>
    <button class="tool" id="tBook" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11M9 8h6"/></svg>帳簿</button>
    <button class="tool" id="tMenu" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>その他</button>
  </nav>
</section>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
document.documentElement.lang = 'ja';
const $ = (id) => document.getElementById(id);

/* ======================= constants & data ======================= */
const W = 32, H = 32, N = W * H, TS = 28;
const HOUR_SEC = 2.5, WALK = 8, CARRY = 6, BUILD_RATE = 1.2, OUT_CAP = 24, IN_TARGET = 12, EAT = 0.4;
const GATE = 20 * W + 0;
const CASTLE = { x: 16, y: 9, w: 4, h: 4 };
const SAVE_KEY = 'jokamachi:save:v1', SET_KEY = 'jokamachi:settings:v1';
const SEASONS = ['春', '夏', '秋', '冬'];
const KOKU = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (n) => Math.floor(n + 1e-9).toLocaleString('ja-JP');
const g0 = (o, k) => o[k] || 0;
const addTo = (o, k, v) => { o[k] = (o[k] || 0) + v; };
const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

const GOODS = {
  log: { name: '原木', col: '#7a5230' }, wood: { name: '材木', col: '#c9965c' }, stone: { name: '石', col: '#8d8b86' },
  rice: { name: '米', col: '#f2ead2' }, fish: { name: '魚', col: '#5f8fb3' }, clay: { name: '粘土', col: '#b36b3a' },
  tile: { name: '瓦', col: '#4c5563' }, sake: { name: '酒', col: '#d8b75a' },
};
const GK = Object.keys(GOODS);
const PRICE = { log: 2, wood: 4, stone: 3, rice: 3, fish: 3, clay: 2, tile: 8, sake: 10 };
const ROOF = {
  kaya: ['#c4a565', '#8c7341'], ita: ['#9a7552', '#694e35'], kawara: ['#5f6877', '#434a56'], kura: ['#f3eee2', '#3f4651'],
  kiln: ['#7d6b5b', '#4f4339'], shrine: ['#b23c2a', '#7e2a1e'], temple: ['#565e6b', '#3a404a'], market: ['#d9c9a3', '#b23c2a'],
  field: ['#a9c47a', '#7f9a55'], yard: ['#cdb790', '#8f7a58'],
};
const DEF = {
  house: { name: '長屋', ic: '長', w: 2, h: 2, cost: { wood: 8 }, money: 10, work: 20, res: 8, roof: 'kaya', cat: '住まい', unlock: 0,
    desc: '8人が住める。市（9マス）か蔵（6マス）の近くでないと食べ物が届かない。' },

      <div class="acts"><button class="btn" type="button" data-act="close">閉じる</button></div>`;
    const next = STAGES[S.castle];
    return `${head('城', '#b23c2a', '城山', S.castle >= 3 ? '青葉城' : `城（${STAGES[S.castle - 1].name}まで完成）`)}
      <p class="desc">${S.castle >= 3 ? '城下を見下ろす天守。町人の誇りとなっている。' : '築城はまだ途中。'}町人の満足度 +${S.castle * 4}</p>
      ${next ? `<div class="rows"><div><span>次の普請</span><b>${next.name}</b></div><div><span>材料</span><b>${costStr(next.cost, next.money)}</b></div></div>` : ''}

  }

    for (const g in d.out) rows.push(`<div><span>${GOODS[g].name}の生産</span><b>1日およそ${fmt(per * d.out[g])}</b></div>`);

}
function siteRows(b) {

function ledgerHtml() {
  const m = S.stats.yday.made || {}, u = S.stats.yday.used || {};
  const goods = GK.map((g) => `<div><span>${GOODS[g].name}</span><b>${fmt(stock(g))}<span class="sub">　昨日 +${fmt(m[g] || 0)} / −${fmt(u[g] || 0)}</span></b></div>`).join('');
  const jobs = S.b.reduce((n, b) => n + (b.done && !b.stopped ? jobsOf(b) : 0), 0);
  const employed = S.c.filter((c) => c.job).length;
  const cap = S.b.reduce((n, b) => n + (b.done ? resOf(b) : 0), 0);
  const food = stock('rice') + stock('fish') + S.b.filter((b) => b.k === 'market').reduce((n, b) => n + g0(b.store, 'rice') + g0(b.store, 'fish'), 0);
  const days = foodDays();
  const role = (r) => S.b.filter((b) => b.done && DEF[b.k] && DEF[b.k].role === r).reduce((n, b) => n + b.workers.length, 0);
  const hungry = S.b.filter((b) => b.done && resOf(b) && b.fed === false).length;
  return `${head('簿', '#2f4f6f', '帳簿', dateStr())}
    <div class="sec">蔵の品（すべての蔵の合計）</div><div class="rows">${goods}</div>
    <div class="sec">人々</div><div class="rows">
      <div><span>人口 / 住める数</span><b>${S.c.length} / ${cap}人</b></div>
      <div><span>働いている / 仕事の数</span><b>${employed} / ${jobs}人</b></div>
      <div><span>人足 ・ 大工</span><b>${role('porter')}人 ・ ${role('builder')}人</b></div>
      <div><span>人足の忙しさ（いま）</span><b>${porterBusy()}</b></div>
      <div><span>仕事のない人</span><b>${S.c.length - employed}人</b></div>
      <div><span>満足度の平均</span><b>${S.happy}</b></div>
      <div><span>食べ物の蓄え</span><b>${fmt(food)}（およそ${Math.floor(days)}日分）</b></div>
      ${hungry ? `<div><span>食べ物が届かない長屋</span><b style="color:var(--shu)">${hungry}軒</b></div>` : ''}
    </div>
    <p class="note">満足度は、食事・米と魚の両方・酒・湯屋・寺社・城の進み具合で上がります。満足度が高いほど人が集まり、よく働きます。</p>`;
}
function porterBusy() {
  const ps = S.c.filter((c) => c.job && B(c.job) && B(c.job).k === 'warehouse');
  if (!ps.length) return '人足がいません';
  if (!isWork()) return '夜は休み';
  const busy = ps.filter((c) => c.task).length, r = busy / ps.length;
  return `${busy}/${ps.length}人が運搬中${r > 0.85 ? '（手が足りない）' : ''}`;
}

/* --- sheet events --- */
$('sheet').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  sfx.tap();
  const act = t.dataset.act;
  if (act === 'close') { closeSheet(); return; }
  if (act === 'story') { showStoryLine(); return; }
  if (act === 'replay') { const ch = CHAPTERS[S.chapter]; closeSheet(); playStory([...ch.intro], () => openGoals()); return; }
  if (act === 'help') { openHelp(); return; }
  if (act === 'sound') { SET.sound = !SET.sound; saveSet(); t.textContent = `効果音：${SET.sound ? 'オン' : 'オフ'}`; return; }
  if (act === 'save') { save(); toast('保存した'); return; }
  if (act === 'title') { save(); closeSheet(); toTitle(); return; }
  if (act === 'castle') { startCastleStage(); closeSheet(); return; }
  if (act === 'demolish') {
    const b = B(selected); if (!b) return;
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'もう一度押すと取りこわす'; return; }
    closeSheet(); demolish(b); return;
  }
  if (t.dataset.cat) { buildCat = t.dataset.cat; openBuildMenu(); return; }
  if (t.dataset.build) { const k = t.dataset.build; if (S.chapter < DEF[k].unlock) { toast('物語を進めると建てられます'); return; } startBuild(k); return; }
  const b = B(selected);
  if (b && t.dataset.prio !== undefined) { b.prio = Number(t.dataset.prio); b.stopped = false; assignJobs(true); save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.stop) { b.stopped = !b.stopped; assignJobs(false); save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.allow) { b.allow[t.dataset.allow] = !b.allow[t.dataset.allow]; save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.tmode) { const [g, m] = t.dataset.tmode.split(':'); const o = b.orders[g] || { mode: 'none', n: g === 'rice' ? 60 : 20 }; o.mode = m; b.orders[g] = o; save(); sheetFn && sheetFn(); return; }
  if (b && t.dataset.tstep) { const [g, s] = t.dataset.tstep.split(':'); const o = b.orders[g]; if (!o) return; o.n = clamp(o.n + (s === '+' ? 5 : -5), 0, 500); save(); sheetFn && sheetFn(); return; }
});

/* --- map input --- */
const surf = V3 ? $('gl') : cv;
const ptrs = new Map(); let pinch = null, dragMoved = false;
surf.addEventListener('pointerdown', (e) => {
  sfx.unlock(); try { surf.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, btn: e.button });
  if (ptrs.size === 1) dragMoved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; dragMoved = true; }
});
surf.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    if (Math.hypot(p.x - p.x0, p.y - p.y0) > 8) dragMoved = true;
    if (dragMoved) { if (p.btn === 2) VIEW.rotate(-dx * 0.008); else VIEW.pan(dx, dy); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], r = surf.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, ang = Math.atan2(b.y - a.y, b.x - a.x), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    VIEW.pan(mx - pinch.mx, my - pinch.my);
    VIEW.zoomAt(mx - r.left, my - r.top, pinch.d / d);
    let da = ang - pinch.ang; if (da > Math.PI) da -= Math.PI * 2; if (da < -Math.PI) da += Math.PI * 2;
    VIEW.rotate(-da);
    pinch = { d, ang, mx, my };
  }
});
const endPtr = (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const q = [...ptrs.values()][0]; q.x0 = q.x; q.y0 = q.y; }
  if (e.type === 'pointerup' && ptrs.size === 0 && !dragMoved) { const r = surf.getBoundingClientRect(); tapMap(e.clientX - r.left, e.clientY - r.top); }
};
surf.addEventListener('pointerup', endPtr); surf.addEventListener('pointercancel', endPtr);
surf.addEventListener('wheel', (e) => { e.preventDefault(); const r = surf.getBoundingClientRect(); VIEW.zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY > 0 ? 1.12 : 0.89); }, { passive: false });
surf.addEventListener('contextmenu', (e) => e.preventDefault());
function tapMap(px, py) {
  const pk = VIEW.pick(px, py); if (!pk) return;
  const [x, y] = pk;
  if (!inb(x, y)) { return; }
  const i = idx(x, y);
  if (mode && mode.type === 'build') { const d = DEF[mode.k]; mode.x = clamp(x - Math.floor((d.w - 1) / 2), 0, W - d.w); mode.y = clamp(y - Math.floor((d.h - 1) / 2), 0, H - d.h); updatePlacebar(); sfx.tap(); return; }
  if (mode && mode.type === 'road') {
    if (mode.a === null || mode.preview) { if (mode.preview && i === mode.a) return; if (mode.a === null) { mode.a = i; mode.preview = null; } else { mode.preview = lPath(mode.a, i); } }
    else { mode.preview = i === mode.a ? null : lPath(mode.a, i); }
    updatePlacebar(); sfx.tap(); return;
  }
  if (mode && mode.type === 'remove') { const b = occ[i] >= 0 ? B(occ[i]) : null; mode.target = b ? { b } : road[i] ? { i } : null; updatePlacebar(); sfx.tap(); return; }
  if (occ[i] >= 0) { sfx.tap(); openInfo(B(occ[i])); return; }
  if (TER[i] === 'h') {
    if (S.chapter >= 5) { const st = STAGES[S.castle]; openSheet(`${head('城', '#b23c2a', '城山', '築城を始める')}<p class="desc">${st.desc}</p><div class="rows"><div><span>材料</span><b>${costStr(st.cost, st.money)}</b></div></div><p class="note">城山に接するように道をつないでおくと、人足と大工が通えます。</p><div class="acts"><button class="btn btn-shu" type="button" data-act="castle">${st.name}の普請を始める</button><button class="btn" type="button" data-act="close">閉じる</button></div>`); }
    else toast('城山。いずれ殿の城がここに建つ');
    return;
  }
  const names = { '.': '平地', f: '森（木こり小屋の近くに）', w: '川（道を引くと橋になる）', r: '岩場（石切り場はこの隣に）', c: '粘土の土地（粘土場を建てられる）' };
  toast(names[TER[i]] || '');
}

/* ======================= loop & screens ======================= */
function frame(t) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;
  const running = !paused && !(sheetPause && !$('sheetWrap').hidden) && $('title').hidden;
  if (running && S) {
    let dtH = dt / HOUR_SEC * SET.speed;
    while (dtH > 0) { const st = Math.min(dtH, 0.05); tick(st); dtH -= st; }
  }
  if (V3) V3.render(t, dt); else draw(t);
  if (S && t - (frame.lastUi || 0) > 250) { frame.lastUi = t; renderTop(); if (mode) updatePlacebar(); if (t - (frame.lastCh || 0) > 1000) { frame.lastCh = t; checkChapter(); } }
}
function showGame() {
  $('title').hidden = true; $('game').hidden = false;
  requestAnimationFrame(() => { resize(); terrainDirty = true; });
  if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(frame); }
}
function toTitle() {
  exitMode(); cancelAnimationFrame(rafId); rafId = 0;
  $('game').hidden = true; $('title').hidden = false; renderTitle();
}
function renderTitle() {
  const d = store.get(SAVE_KEY, null);
  const cb = $('contBtn'), nb = $('newBtn');
  if (d && d.t !== undefined) { const day = Math.floor(d.t / 24); cb.hidden = false; cb.innerHTML = `<span>つづきから</span><small>${Math.floor(day / 20) + 1}年目 ${SEASONS[Math.floor((day % 20) / 5)]} ・ 人口${(d.c || []).length}人</small>`; nb.className = 'btn'; }
  else { cb.hidden = true; nb.className = 'btn btn-shu'; }
  nb.textContent = '新しく始める'; delete nb.dataset.armed;
}
$('contBtn').addEventListener('click', () => { sfx.unlock(); if (!load()) { toast('保存データを読めませんでした'); renderTitle(); return; } showGame(); });
$('newBtn').addEventListener('click', () => {
  sfx.unlock(); const nb = $('newBtn');
  if (store.get(SAVE_KEY, null) && !nb.dataset.armed) { nb.dataset.armed = '1'; nb.textContent = 'もう一度押すと新しく始めます（今の町は消えます）'; return; }
  newGame(); save(); showGame();
});
window.addEventListener('resize', () => { if (!$('game').hidden) resize(); });
if ('ResizeObserver' in window) new ResizeObserver(() => { if (!$('game').hidden) resize(); }).observe(stageEl);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !$('game').hidden) save(); });
window.addEventListener('pagehide', () => { if (S && !$('game').hidden) save(); });
if (document.fonts && document.fonts.load) document.fonts.load('800 14px "Shippori Mincho B1"').then(() => { if (V3) V3.resetLabels(); }).catch(() => {});
$('rotBtns').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !V3) return; sfx.tap(); V3.rotateStep(Number(b.dataset.rot)); });
renderTitle();
</script>
